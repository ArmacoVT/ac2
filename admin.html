<title>Arcus Club · Админ панел</title>

<link rel="stylesheet" href="fonts/fonts.css" />
<style>
  :root{--bg:#ebebd6;--surface:#f4f4e8;--gold:#82303d;--gold-soft:#652430;--cream:#000000;--text:#1c1c1b;
    --mid:#4b4b45;--muted:#6b6b63;--line:rgba(0,0,0,0.16);--ok:#507044;--warn:#82303d;--serif:'Playfair Display',Georgia,serif;
--sans:'Google Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);}
  .wrap{max-width:760px;margin:0 auto;padding:0 16px 60px;}
  .top{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;
    padding:14px 0;background:rgba(235,235,214,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);margin-bottom:18px;}
  .top .b{font-family:var(--serif);font-style:italic;color:var(--gold);font-size:19px;letter-spacing:0;}
  .top .b small{color:var(--mid);font-size:12px;letter-spacing:0;}
  .tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
  .tab{border:1px solid var(--line);background:transparent;color:var(--text);border-radius:22px;padding:8px 16px;font-size:14px;cursor:pointer;font-family:inherit;}
  .tab.on{background:var(--gold);color:var(--bg);border-color:var(--gold);font-weight:600;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px;}
  /* „за действие“: непрегледани / чакащи записи */
  .card.att{border-left:4px solid #82303D;background:#F7F7EE;box-shadow:0 2px 10px rgba(130,48,61,.10);}
  .card.att.amber{border-left-color:#C98A2B;}
  .tagn{display:inline-block;font-size:10px;font-weight:800;letter-spacing:1px;padding:3px 8px;border-radius:8px;vertical-align:middle;margin-left:6px;color:#F7F7EE;background:#82303D;}
  .tagn.amber{background:#C98A2B;}
  .tagn.grey{background:#5F6064;}
  .inbox{background:#F7F7EE;border:1px solid #82303D;border-radius:14px;padding:14px 16px;margin:0 0 16px;}
  .inbox h3{margin:0 0 8px;font-size:15px;}
  .inbox .row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid #E3E3D3;flex-wrap:wrap;}
  .inbox .row:first-of-type{border-top:0;}
  .inbox .row .t{font-size:13.5px;line-height:1.35;}
  .inbox .row .a{display:flex;gap:6px;flex-wrap:wrap;}
  h2{font-family:var(--serif);font-style:italic;color:var(--cream);font-weight:700;font-size:22px;margin-bottom:12px;}
  h3{color:var(--cream);font-size:16px;font-weight:500;}
  label{display:block;color:var(--mid);font-size:13px;margin:10px 0 5px;}
  input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:11px;color:var(--cream);font-size:15px;font-family:inherit;}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold-soft);}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .btn{background:var(--gold);color:var(--bg);border:none;border-radius:10px;padding:12px 18px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--gold);}
  .btn.sm{padding:7px 13px;font-size:13px;border-radius:18px;}
  .btn.ok{background:var(--ok);color:#fff;}
  .btn.no{background:transparent;border:1px solid var(--warn);color:#9a3a49;}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;}
  .ck{border:1px solid var(--line);border-radius:20px;padding:7px 13px;font-size:13px;cursor:pointer;user-select:none;}
  .ck.on{background:var(--gold);color:var(--bg);border-color:var(--gold);font-weight:600;}
  .pill{display:inline-block;font-size:11px;letter-spacing:1px;border:1px solid var(--gold);color:var(--gold);border-radius:14px;padding:2px 9px;}
  .pill.audAll{border-color:var(--ok);color:#3d5634;}
  .muted{color:var(--muted);font-size:13px;}
  .badge{font-size:11px;border-radius:12px;padding:2px 10px;border:1px solid var(--line);color:var(--mid);}
  .badge.live{border-color:var(--ok);color:#3d5634;}
  .gate{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;}
  .gate .ring{width:120px;height:120px;border:1px solid var(--gold);border-radius:50%;display:flex;align-items:center;justify-content:center;}
  .gate .ring span{font-family:var(--serif);font-style:italic;color:var(--gold);font-size:38px;}
  .gate h1{font-family:var(--serif);font-style:italic;color:var(--cream);font-size:26px;font-weight:500;margin-top:20px;}
  .gate .f{width:100%;max-width:300px;margin-top:24px;}
  .gate input{margin-bottom:11px;}
  .empty{color:var(--muted);font-style:italic;padding:8px 0;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;color:var(--mid);font-weight:500;padding:8px;border-bottom:1px solid var(--line);}
  td{padding:8px;border-bottom:1px solid var(--line);color:var(--text);}
</style>
</head>
<body>
<div id="root" style="padding:40px;text-align:center;color:var(--muted);">Зареждане…</div>

<script src="vendor/qrcode.js"></script>

<script>
const MEMBERS=[{id:'founder',t:'Founder'},{id:'founding',t:'Founding Member'},{id:'club',t:'Club Member'},{id:'alumni',t:'Alumni Member'},{id:'corporate',t:'Corporate Member'}];
const FORMATS=['culture','table','conversation','community','online'];
const EVTAGS=[
  {id:'lang_bg',g:'Език',t:'На български'},{id:'lang_en',g:'Език',t:'На английски'},{id:'lang_bi',g:'Език',t:'Двуезично / с превод'},
  {id:'acc_wheel',g:'Достъпност',t:'Достъпно с количка'},{id:'acc_blind',g:'Достъпност',t:'За незрящи'},
  {id:'acc_deaf',g:'Достъпност',t:'За глухи (субтитри)'},{id:'acc_hearing',g:'Достъпност',t:'Асистивно слушане'},
  {id:'aud_18',g:'Публика',t:'Само 18+'},{id:'aud_family',g:'Публика',t:'Семейно'},{id:'aud_limited',g:'Публика',t:'Ограничени места'},
  {id:'set_outdoor',g:'Обстановка',t:'На открито'},{id:'set_formal',g:'Обстановка',t:'Дрес код: официален'},
  {id:'set_smart',g:'Обстановка',t:'Дрес код: smart casual'},{id:'set_nophoto',g:'Обстановка',t:'Без снимки'},
  {id:'set_parking',g:'Обстановка',t:'Паркинг на място'},
  {id:'cat_dinner',g:'Кетъринг',t:'Вечеря включена'},{id:'cat_drinks',g:'Кетъринг',t:'Коктейл / напитки'},{id:'cat_veg',g:'Кетъринг',t:'Веге / веган опции'}
];
const FMT_LABEL={culture:'AC² Culture',table:'AC² Table',conversation:'AC² Conversation',community:'AC² Arcus Community',online:'AC² Online',cinema:'AC² Culture (старо: Cinema)',music:'AC² Culture (старо: Music)',theater:'AC² Culture (старо: Theater)'};
const VENUES=['Ресторант','Камерна зала','Онлайн','Галерия','Private room'];
const memName=id=>(MEMBERS.find(m=>m.id===id)||{t:id}).t;
const esc=s=>(''+(s??'')).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
// ВАЖНО: никога не вграждай текст от потребител в onclick="f('...')" — там HTML се декодира
// ПРЕДИ да се изпълни JS, значи ' се измъква от кавичките. Подавай само id и търси обекта.
const byId=(arr,id)=>(arr||[]).find(x=>x.id===id)||{};

let tab='events', editId=null, draftAud=['all'], admin=false, role='', PERMS=[];
// ---- Права ----
// Администраторът има всичко. Останалите служители — само отметнатите права (profiles.perms).
const PERM_DEFS=[
  {id:'events',t:'Събития',d:'създаване и редакция на събития, архив, видимост по членство'},
  {id:'reservations',t:'Резервации',d:'одобряване/отказ, check-in, архив на резервациите'},
  {id:'members_view',t:'Членове — преглед',d:'вижда списъка с членове (без промени)'},
  {id:'members_edit',t:'Членове — редакция',d:'покани, подновяване, нива, телефони, пароли'},
  {id:'applications',t:'Кандидатури',d:'преглед и одобряване на кандидатури'},
  {id:'news',t:'Новини',d:'съобщения към членовете в приложението'},
  {id:'site',t:'Публичен сайт',d:'текстове, снимки, меню, нива на членство на ac2.bg'},
  {id:'messages',t:'Съобщения',d:'контактна форма и нюзлетър'},
  {id:'stats',t:'Статистика',d:'справки и графики'},
  {id:'audit',t:'Журнал',d:'кой какво е променил'},
  // „опасни“ права — отделни отметки (важат и в базата)
  {id:'res_delete',t:'⚠ Изтриване на резервации',d:'необратимо изтриване (не само отказ)',danger:true},
  {id:'refunds',t:'⚠ Връщане на пари',d:'refund по картата през Stripe',danger:true},
  {id:'walkin',t:'⚠ Билет на място',d:'продажба в брой / на ПОС от рецепцията',danger:true},
  {id:'events_delete',t:'⚠ Изтриване на събития',d:'заедно с резервациите към тях',danger:true},
  {id:'fees',t:'⚠ Членства и цени',d:'цени на членствата, покани за плащане, банкови преводи',danger:true},
  {id:'team',t:'⚠ Екип и права',d:'добавя/маха служители и права (дава се само от собственика)',danger:true,ownerOnly:true},
  {id:'money',t:'Суми и приходи (преглед)',d:'вижда приходите в Статистика и сумите в Excel експорта на събития + месечния отчет'},
  {id:'accounting',t:'Счетоводство (само преглед)',d:'вижда резервации с платени суми, плащания за членства, цени; експорт за месеца — без никакви действия'}];
const PERM_PRESETS=[
  {id:'deputy',t:'Заместник-админ',p:['events','reservations','members_view','members_edit','applications','news','site','messages','stats','audit','res_delete','refunds','walkin','events_delete']},
  {id:'manager',t:'Мениджър',p:['events','reservations','members_view','members_edit','applications','news','site','messages','stats','audit','walkin']},
  {id:'editor',t:'Редактор',p:['events','news','site']},
  {id:'reception',t:'Рецепция',p:['reservations','members_view','messages','walkin']},
  {id:'accountant',t:'Счетоводство',p:['accounting','stats','audit']}];
let PERMS_UNTIL='', IS_OWNER=false;
const permsLive=()=>!PERMS_UNTIL||PERMS_UNTIL>=new Date().toISOString().slice(0,10);
const can=p=>role==='admin'||(permsLive()&&PERMS.includes(p));
const isEditor=()=>role!=='admin';   // „служител“ (не админ) — показва бележка под табовете
// кои табове с кое право
const TAB_PERM={events:'events',archive:'events',members:'events',res:'reservations',people:'members_view',apps:'applications',ann:'news',public:'site',messages:'messages',stats:'stats',audit:'audit',team:'team',fees:'fees'};
const TAB_ALT={res:'accounting',fees:'accounting'};   // счетоводство вижда тези раздели само за преглед
const tabAllowed=t=>TAB_PERM[t]?(can(TAB_PERM[t])||(TAB_ALT[t]&&can(TAB_ALT[t]))):role==='admin';
const canExport=()=>role==='admin'||can('accounting')||can('fees')||can('stats');
const canMoney=()=>role==='admin'||can('money')||can('accounting')||can('fees');   // суми/приходи — отметка „Суми и приходи“ (или админ, счетоводство, членства и цени)
function firstTab(){ for(const t of ['events','res','people','apps','ann','public','messages','stats','audit','team']) if(tabAllowed(t)) return t; return 'events'; }
let EVENTS=[], RES=[];
const root=document.getElementById('root');

// ---- Изтекла сесия ----
// Преди това администраторът нямаше как да разбере: бутоните просто мълчаха.
let _sessionLost=false, _loggingOut=false;
function sessionLost(){
  if(_sessionLost||_loggingOut||!admin)return; _sessionLost=true;
  const ov=document.createElement('div');
  ov.style.cssText='position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:20px;';
  ov.innerHTML=`<div style="background:var(--card,#f7f7ee);border-radius:16px;padding:24px;max-width:340px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3);">
    <h3 style="margin:0 0 8px;">Сесията изтече</h3>
    <p style="color:var(--muted);font-size:13px;margin:0 0 16px;">Не сте вписан вече. Промените, които направите сега, няма да се запазят.</p>
    <button class="btn" style="width:100%;" onclick="location.reload()">Влез отново</button></div>`;
  document.body.appendChild(ov);
}
async function checkSession(){ if(!_sessionLost && !(await DB.sessionAlive())) sessionLost(); }

async function boot(){
  if(DB.live){ const u=await DB.getUser(); role=u?u.role:''; MY_ID=u?u.id:''; PERMS=(u&&u.perms)||[]; PERMS_UNTIL=(u&&u.perms_until)||''; IS_OWNER=!!(u&&u.is_owner); if(role==='editor'&&!PERMS.length)PERMS=['events','news','site','messages']; admin=!!(u&&(u.role==='admin'||(PERMS.length&&permsLive()))); if(admin&&!tabAllowed(tab))tab=firstTab(); }
  else { admin=localStorage.getItem('acac_admin')==='1'; role='admin'; }
  if(admin) await refresh();
  render();
  if(DB.live&&admin){
    startAdminLive();
    DB.onSessionLost(sessionLost);
    window.addEventListener('acac-session-lost',sessionLost);
    setInterval(checkSession,60000);                 // на всяка минута
    document.addEventListener('visibilitychange',()=>{ if(!document.hidden)checkSession(); });
    // Резервен вариант, ако Realtime не работи: на всяка минута (и при връщане в таба) питаме „има ли нещо ново?“
    // Ново → ако не се пише в поле: обновяваме сами; иначе светва „● Нови заявки — обнови“.
    checkNew(true); setInterval(()=>checkNew(false),60000);
    document.addEventListener('visibilitychange',()=>{ if(!document.hidden)checkNew(false); });
  }
}
let _stamps=null;
async function checkNew(baseline){
  let st; try{ st=await DB.latestStamps(); }catch(e){ return; }
  if(!st)return;
  if(baseline||!_stamps){ _stamps=st; return; }
  const changed=['reservations','applications','messages'].filter(k=>(st[k]||'')>(_stamps[k]||''));
  if(!changed.length)return;
  _stamps=st;
  const editing=editId||(document.activeElement&&/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName))||document.querySelector('#miModal,#qrModal,#wkModal');
  const what=changed.map(k=>k==='reservations'?'резервация':k==='applications'?'кандидатура':'съобщение').join(', ');
  if(editing){ window._newData=true; const b=document.getElementById('newdataBtn'); if(b)b.style.display='inline-block'; toast('🔔 Нова '+what+' — натисни „Нови заявки — обнови“'); return; }
  await refresh(); if(tab==='messages'){try{MSGS=await DB.listContactMessages();}catch(e){}} render(); toast('🔔 Нова '+what);
}
// Реалтайм: при промяна в базата опресняваме данните и таба (със забавяне, за да не мигат бързи серии).
let _liveT=null, _liveSeen=false;
function startAdminLive(){
  if(_liveSeen)return; _liveSeen=true;
  DB.onAdminChange((table,type,row)=>{
    if(type==='INSERT'){
      const msg=table==='reservations'?'Нова резервация':table==='applications'?'Нова кандидатура':table==='contact_messages'?'Ново съобщение от сайта':table==='newsletter_subscribers'?'Нов абонат за нюзлетъра':table==='membership_payments'?(row&&row.method==='bank'?'Заявен банков превод за членство':''):'';
      if(msg)toast('🔔 '+msg);
    } else if(table==='reservations'&&type==='UPDATE'&&row&&row.status==='cancelled'){ toast('Резервация е отменена от член'); }
    clearTimeout(_liveT);
    _liveT=setTimeout(async()=>{
      // не пипаме формата, докато админът пише в нея
      const editing=editId||document.activeElement&&/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
      await refresh();
      if(table==='profiles'||table==='membership_payments'||table==='membership_codes'){ if(tab==='people'||tab==='team'){try{PEOPLE=await DB.listMembers();}catch(e){}} if(tab==='fees'){try{await loadFees();}catch(e){}} }
      if(tab==='messages'&&(table==='contact_messages'||table==='newsletter_subscribers')){MSGS=await DB.listContactMessages();SUBS=await DB.listSubscribers();}
      if(!editing)render();
    },800);
  });
}
async function refresh(){
  try{ EVENTS=await DB.listEvents(); }catch(e){ EVENTS=[]; }
  try{ RES=await DB.listReservations(); }catch(e){ RES=[]; }
  try{ APPS=await DB.listApplications(); }catch(e){ APPS=APPS||[]; }
  if(can('messages')){ try{ MSGS=await DB.listContactMessages(); }catch(e){} }
  if(can('fees')||can('accounting')){ try{ MPAY=await DB.listMembershipPayments(300); }catch(e){} }
}
let MPAY=null, MPRICES=null, MCODES=null;
// ---------- „За действие“: какво чака човек ----------
// резервация: нова заявка (requested) · непрегледана (seen_at празно) · отказ от член (cancelled) непрегледан · платена+отменена без върната сума
function resNeedsRefund(r){ return r.paid && !r.refunded_at && (r.status==='cancelled'||r.status==='declined'); }
function resAttention(r){
  if(resIsOld(r))return '';
  const st=r.status||'requested';
  if(st==='requested')return 'new';
  if(resNeedsRefund(r))return 'refund';
  if(!r.seen_at&&st==='cancelled')return 'cancel';
  if(!r.seen_at)return 'new';
  return '';
}
function attItems(){
  const out=[];
  if(can('reservations'))RES.forEach(r=>{const a=resAttention(r);if(a)out.push({k:'res',a,r});});
  if(can('applications'))(APPS||[]).forEach(x=>{if((x.status||'new')==='new'||!x.seen_at)out.push({k:'app',a:'new',r:x});});
  if(can('messages'))(MSGS||[]).forEach(m=>{if(!m.is_read)out.push({k:'msg',a:'new',r:m});});
  if(can('fees'))(MPAY||[]).forEach(x=>{if(x.status==='pending'&&x.method==='bank')out.push({k:'mpay',a:'bank',r:x});});
  return out;
}
function attCount(k){ return attItems().filter(i=>!k||i.k===k).length; }
function setTitleCount(){ const n=attItems().length; document.title=(n?'('+n+') ':'')+'AC² · Админ'; }
async function markSeenRes(id){
  if(!can('reservations'))return;
  const r=RES.find(x=>x.id===id); if(!r||r.seen_at)return;
  r.seen_at=new Date().toISOString();
  const c=document.getElementById('rescard_'+id); if(c&&!resAttention(r)){c.classList.remove('att','amber');const t=c.querySelector('.tagn');if(t)t.remove();}
  try{await DB.markSeen('reservations',[id]);}catch(e){}
  renderTabsOnly();
}
async function markSeenApp(id){
  const a=(APPS||[]).find(x=>x.id===id); if(!a||a.seen_at)return;
  a.seen_at=new Date().toISOString(); try{await DB.markSeen('applications',[id]);}catch(e){} setTitleCount();
}
async function markAllSeen(){
  const rid=RES.filter(r=>!r.seen_at&&(r.status||'requested')!=='requested').map(r=>r.id);
  const aid=(APPS||[]).filter(a=>!a.seen_at&&(a.status||'new')!=='new').map(a=>a.id);
  const now=new Date().toISOString();

async function refundRes(id){

  const ev=r.event_id?EVENTS.find(e=>e.id===r.event_id):null; const total=r.paid_cents||(ev&&ev.price?Math.round(ev.price*100*(r.party||1)):0);
  const already=r.refund_cents||0; const remaining=Math.max(0,total-already);
  if(total&&remaining<=0){alert('Цялата сума ('+(total/100).toFixed(2)+' €) вече е върната.');return;}
  const inp=prompt('Сума за връщане в € по картата на „'+(r.name||r.who||'члена')+'“ през Stripe.\n\n'+(already?'Вече върнати '+(already/100).toFixed(2)+' €; остават '+(remaining/100).toFixed(2)+' € от '+(total/100).toFixed(2)+' €.':'Цялата сума е '+(total?(total/100).toFixed(2):'?')+' €.')+' За частично връщане напиши по-малка сума (напр. 10 или 12.50).\nПарите стигат до картата за 5–10 работни дни. Действието е необратимо.', remaining?(remaining/100).toFixed(2):'');
  if(inp===null)return;

  const cents=Math.round(eur*100); if(remaining&&cents>remaining){alert('Сумата е по-голяма от оставащото за връщане ('+(remaining/100).toFixed(2)+' €).');return;}
  const partial=total&&(already+cents)<total;
  if(!confirm((partial?'ЧАСТИЧНО връщане: ':'Връщане: ')+(cents/100).toFixed(2)+' €'+(partial?' (общо върнати ще са '+((already+cents)/100).toFixed(2)+' € от '+(total/100).toFixed(2)+' €)':'')+'. Потвърждаваш ли?'))return;
  toast('Връщане през Stripe…');

function animateCounts(){
  document.querySelectorAll('.countup').forEach(el=>{

    if(!to){el.textContent='0';return;}
    const dur=700,start=performance.now();
    const step=now=>{const p=Math.min(1,(now-start)/dur);
      el.textContent=Math.round(to*(1-Math.pow(1-p,3)));

    requestAnimationFrame(step);
  });

// заети места за събитие: потвърдените резервации (и отделно чакащите)
function seatsTaken(evId){return RES.filter(r=>r.event_id===evId&&r.status==='confirmed').reduce((s,r)=>s+(r.party||1),0);}
function seatsPending(evId){return RES.filter(r=>r.event_id===evId&&(!r.status||r.status==='requested')).reduce((s,r)=>s+(r.party||1),0);}
const evSlots=e=>(e&&e.pub&&Array.isArray(e.pub.slots))?e.pub.slots.filter(s=>s&&s.time):[];
function seatsInfo(e){
  const slots=evSlots(e);
  if(slots.length){   // по слот: 18:00 · 12/20 · 20:00 · няма места
    return slots.map(s=>{ const tk=RES.filter(r=>r.event_id===e.id&&r.status==='confirmed'&&(r.time||'')===s.time).reduce((a,r)=>a+(r.party||1),0); const cap=Number(s.cap)||0; const left=cap-tk;
      const col=cap&&left<=0?'#82303d':(cap&&left<=Math.ceil(cap*0.2)?'#6b6b63':'#507044');
      return `<span class="pill" style="border-color:${col};color:${col};">${esc(s.time)} · ${cap?(left<=0?'няма места':'остават '+left+' от '+cap):tk+' записани'}</span>`; }).join(' ')+(seatsPending(e.id)?` <span class="pill">${seatsPending(e.id)} чакащи</span>`:'');
  }
  if(!e.capacity)return '';
  const taken=seatsTaken(e.id), left=e.capacity-taken, pend=seatsPending(e.id);
  const col=left<=0?'#82303d':(left<=Math.ceil(e.capacity*0.2)?'#6b6b63':'#507044');
  return `<span class="pill" style="border-color:${col};color:${col};">${left<=0?'няма места':'остават '+left+' от '+e.capacity}</span>`+
    (pend?` <span class="pill">${pend} чакащи</span>`:'');
}
// маси след събитието (свързани чрез table_event_id)
function tableTaken(evId){return RES.filter(r=>r.table_event_id===evId&&r.status==='confirmed').reduce((s,r)=>s+(r.party||1),0);}
function tableInfo(e){
  if(!e.table_capacity)return '';
  const taken=tableTaken(e.id), left=e.table_capacity-taken;
  const col=left<=0?'#82303d':(left<=Math.ceil(e.table_capacity*0.2)?'#6b6b63':'#507044');
  return `<span class="pill" style="border-color:${col};color:${col};">🍽 ${left<=0?'няма маси':'маси: остават '+left+' от '+e.table_capacity}</span>`;
}
// разгъващ се списък „кой е запазил" за дадено събитие (билети + маси)
function eventResList(e){
  const tickets=RES.filter(r=>r.event_id===e.id);
  const tables=RES.filter(r=>r.table_event_id===e.id);
  const all=tickets.concat(tables);
  if(!all.length)return '';
  const stTxt={confirmed:'одобрена',declined:'отказана'};
  const stCol={confirmed:'#507044',declined:'#82303d'};
  const row=(r,isTable)=>{
    const st=r.status||'requested';
    const nm=r.name||r.who||'член';
    const info=(PHONES&&r.user_id)?PHONES[r.user_id]:null;
    const em=r.email||(info&&info.email)||'';
    const ph=r.phone||(info&&info.phone)||'';
    const contact=[em,ph].filter(Boolean).map(esc).join(' · ');
    return `<div style="padding:8px 0;border-top:1px solid var(--line-soft);">
      <div><b>${esc(nm)}</b> · ${r.party||1} ${isTable?'на маса':'места'}${isTable?' 🍽':''}
        <span style="color:${stCol[st]||'var(--muted)'};font-size:12px;"> · ${stTxt[st]||'чакаща'}</span></div>
      ${contact?`<div class="muted" style="font-size:12px;">${contact}</div>`:''}
      ${r.note&&isTable?`<div class="muted" style="font-size:12px;">„${esc(r.note)}"</div>`:''}</div>`;
  };
  const body=tickets.map(r=>row(r,false)).join('')+tables.map(r=>row(r,true)).join('');
  return `<button class="btn ghost sm" style="margin-top:10px;" onclick="toggleEvRes('${e.id}')" id="evrb_${e.id}">Запазили (${all.length}) ▾</button>

}

function admEvStartMs(e){
  if(!e.date)return null;
  const t=(e.time&&/^\d{1,2}:\d{2}/.test(e.time))?e.time.slice(0,5):'00:00';
  const p=e.date.split('-').map(Number),tt=t.split(':').map(Number);
  if(p.length<3)return null;
  return new Date(p[0],p[1]-1,p[2],tt[0]||0,tt[1]||0,0).getTime();
}
function admIsPast(e){
  const ed=e.end_date||e.date; if(!ed)return false;
  const t=(e.ends&&/^\d{1,2}:\d{2}/.test(e.ends))?e.ends.slice(0,5):'23:59';
  const p=ed.split('-').map(Number),tt=t.split(':').map(Number);
  if(p.length<3)return false;
  return Date.now()>new Date(p[0],p[1]-1,p[2],tt[0]||0,tt[1]||0,0).getTime()+2*3600000; // 2 ч след края
}
function admLiveNow(e){
  if(!e.stream_url||e.live_ended||admIsPast(e))return false;
  if(e.is_live)return true;
  if(e.live_auto){const s=admEvStartMs(e);return s&&Date.now()>=s;}
  return false;
}

// Слотове (часове) за резервация — за събития в ресторанта: всеки слот със свой капацитет.
// Пази се в pub.slots = [{time:'18:00',cap:20},…]. Със слотове общият капацитет = сборът им.
function slotsSection(){
  const rows=draftSlots.map((s,i)=>`<div class="row2" style="align-items:center;margin-top:6px;">
      <div style="display:flex;gap:8px;align-items:center;"><input value="${esc(s.time)}" placeholder="18:00" maxlength="5" style="width:90px;text-align:center;" oninput="draftSlots[${i}].time=this.value.trim()"/><span class="muted">час</span></div>
      <div style="display:flex;gap:8px;align-items:center;"><input type="number" min="0" value="${s.cap||''}" placeholder="места" style="width:100px;" oninput="draftSlots[${i}].cap=parseInt(this.value,10)||0"/><span class="muted">места</span><button class="btn ghost sm" type="button" onclick="slotDel(${i})">✕</button></div></div>`).join('');
  const total=draftSlots.reduce((a,s)=>a+(Number(s.cap)||0),0);
  return `<label style="margin-top:10px;">Слотове за резервация (по желание — за вечери в ресторанта: напр. 18:00 и 20:00, всеки със свои места)</label>
    <p class="muted" style="margin:2px 0 4px;font-size:12px;">Със слотове хората избират час при резервация, а местата се броят за всеки час поотделно. Без слотове важи общият капацитет.</p>
    ${rows}
    <div style="margin-top:6px;display:flex;gap:10px;align-items:center;"><button class="btn ghost sm" type="button" onclick="slotAdd()">+ Добави слот</button>${draftSlots.length?`<span class="muted" style="font-size:12px;">Общо ${total} места в ${draftSlots.length} ${draftSlots.length===1?'слот':'слота'}</span>`:''}</div>`;
}
function slotAdd(){ const v=grabForm(); draftSlots.push({time:'',cap:0}); render(); putForm(v); }
function slotDel(i){ const v=grabForm(); draftSlots.splice(i,1); render(); putForm(v); }
function cleanSlots(){
  const out=[]; for(const s of draftSlots){ const t=(s.time||'').trim(); if(!/^\d{1,2}:\d{2}$/.test(t))continue; const hh=t.split(':'); const norm=hh[0].padStart(2,'0')+':'+hh[1]; if(out.some(x=>x.time===norm))continue; out.push({time:norm,cap:Math.max(0,parseInt(s.cap,10)||0)}); }
  return out.sort((a,b)=>a.time<b.time?-1:1);
}
// приоритетно записване: „от дата" за всяко избрано ниво (празно = веднага)
function bwSection(e){
  // при „всички членове" фазите важат за всички нива; иначе само за избраните
  const list=draftAud.includes('all')?MEMBERS.map(m=>m.id):draftAud.filter(id=>id!=='all');

      <div style="padding-top:8px;">Гости (нечленове)</div>
      <div><input id="f_pub_gfrom" readonly placeholder="веднага" value="${gIso?isoToBg(gIso):''}" data-iso="${esc(gIso)}" onclick="openCal('f_pub_gfrom')" style="cursor:pointer;"/></div></div>`:'';
  if(!list.length&&!guestRow)return '';
  const rows=list.map(id=>{
    const mem=MEMBERS.find(m=>m.id===id);

      <div style="padding-top:8px;">${mem?mem.t:id}</div>

  }).join('');
  return `<label style="margin-top:14px;">Приоритетно записване — „записване от" за всяко ниво (празно = веднага)</label>
    <p class="muted" style="margin:2px 0 4px;font-size:12px;">Така напр. Founder записват веднага, Founding след седмица, Club още по-късно, гостите най-накрая. Всички виждат събитието; само записването е на вълни.</p>${rows}${guestRow}`;
}
// запазва/връща въведеното във формата (за да не се губи при преначертаване)
function grabForm(){

    offer_physical:!!(document.getElementById('f_offer_phys')&&document.getElementById('f_offer_phys').checked),

    desc:g('f_desc'),tags:[...document.querySelectorAll('#f_tags input[data-tag]:checked')].map(c=>c.dataset.tag),bw,pub:grabPub()};
}
// Избирачка за час: 24-часов (00–23) + минути през 5; пази стойност HH:MM в скрито поле
function timePickerHTML(id,val){
  val=(val||'').trim();
  let h='',m='';const mt=val.match(/^(\d{1,2}):(\d{2})/);
  if(mt){h=String(+mt[1]).padStart(2,'0');m=String(Math.round(+mt[2]/5)*5%60).padStart(2,'0');}
  let ho='<option value="">--</option>';
  for(let i=0;i<24;i++){const v=String(i).padStart(2,'0');ho+=`<option value="${v}"${v===h?' selected':''}>${v}</option>`;}
  let mo='<option value="">--</option>';
  for(let i=0;i<60;i+=5){const v=String(i).padStart(2,'0');mo+=`<option value="${v}"${v===m?' selected':''}>${v}</option>`;}
  return `<div style="display:flex;align-items:center;gap:6px;">
    <select id="${id}_h" onchange="syncTime('${id}')" style="flex:1;">${ho}</select>
    <b style="opacity:.5;">:</b>
    <select id="${id}_m" onchange="syncTime('${id}')" style="flex:1;">${mo}</select>
    <input type="hidden" id="${id}" value="${val}"></div>`;
}
function syncTime(id){
  const h=document.getElementById(id+'_h').value,m=document.getElementById(id+'_m').value;
  document.getElementById(id).value=h?(h+':'+(m||'00')):'';
}
function setTimeField(id,val){
  const el=document.getElementById(id);if(!el)return;el.value=val||'';
  const mt=(val||'').match(/^(\d{1,2}):(\d{2})/);
  const hs=document.getElementById(id+'_h'),ms=document.getElementById(id+'_m');
  if(hs)hs.value=mt?String(+mt[1]).padStart(2,'0'):'';
  if(ms)ms.value=mt?String(Math.round(+mt[2]/5)*5%60).padStart(2,'0'):'';
}
function putForm(v){
  if(!v)return;
  const s=(id,val)=>{const el=document.getElementById(id);if(el&&val!=null)el.value=val;};
  s('f_title',v.title);s('f_format',v.format);s('f_place',v.place);setTimeField('f_time',v.time);setTimeField('f_ends',v.ends);
  s('f_cap',v.cap);s('f_tcap',v.tcap);s('f_price',v.price);s('f_price_online',v.price_online);s('f_price_archive',v.price_archive);s('f_stream',v.stream);
  s('f_desc',v.desc);
  if(Array.isArray(v.tags))document.querySelectorAll('#f_tags input[data-tag]').forEach(c=>{c.checked=v.tags.includes(c.dataset.tag);});
  const _op=document.getElementById('f_offer_phys');if(_op)_op.checked=!!v.offer_physical;
  const _oo=document.getElementById('f_offer_online');if(_oo)_oo.checked=!!v.offer_online;
  const _oa=document.getElementById('f_offer_archive');if(_oa)_oa.checked=!!v.offer_archive;
  const date=document.getElementById('f_date');
  if(date){date.dataset.iso=v.dateIso||'';date.value=v.dateIso?isoToBg(v.dateIso):'';}
  const ed=document.getElementById('f_end_date');
  if(ed){ed.dataset.iso=v.endDateIso||'';ed.value=v.endDateIso?isoToBg(v.endDateIso):'';}
  if(v.bw)Object.keys(v.bw).forEach(mem=>{const el=document.getElementById('f_bw_'+mem);if(el){el.dataset.iso=v.bw[mem]||'';el.value=v.bw[mem]?isoToBg(v.bw[mem]):'';}});
  const live=document.getElementById('f_live');if(live)live.checked=!!v.live;
  const auto=document.getElementById('f_auto');if(auto)auto.checked=!!v.auto;
  const gated=document.getElementById('f_gated');if(gated)gated.checked=!!v.gated;
  putPub(v.pub);
}
function toggleGuests(){ const v=grabForm(); draftGuests=!draftGuests; render(); putForm(v); }
function toggleAud(id){
  const v=grabForm();
  if(id==='all'){draftAud=['all'];}
  else{draftAud=draftAud.filter(x=>x!=='all');
    if(draftAud.includes(id))draftAud=draftAud.filter(x=>x!==id); else draftAud.push(id);

  putForm(v);
}

// ---------- европейски календар (понеделник = първи ден) ----------
function isoToBg(iso){if(!iso)return'';const p=iso.split('-');return p[2]+'.'+p[1]+'.'+p[0];}
// момент на създаване (UTC от базата → местно време): „27.10.2026 20:48“
function fmtStamp(ts){ try{ const d=new Date(ts); if(isNaN(d))return ''; const z=n=>String(n).padStart(2,'0'); return z(d.getDate())+'.'+z(d.getMonth()+1)+'.'+d.getFullYear()+' '+z(d.getHours())+':'+z(d.getMinutes()); }catch(e){return '';} }
let calM=null,calTarget='f_date';
function openCal(field){
  calTarget=field||'f_date';
  const inp=document.getElementById(calTarget);
  const base=inp.dataset.iso?new Date(inp.dataset.iso+'T00:00:00'):new Date();
  calM={y:base.getFullYear(),m:base.getMonth()};
  drawCal();
}
function calNav(d){calM.m+=d;if(calM.m<0){calM.m=11;calM.y--;}if(calM.m>11){calM.m=0;calM.y++;}drawCal();}
function drawCal(){
  closeCal();
  const inp=document.getElementById(calTarget);if(!inp)return;
  const months=['януари','февруари','март','април','май','юни','юли','август','септември','октомври','ноември','декември'];
  const wd=['пн','вт','ср','чт','пт','сб','нд'];
  const first=new Date(calM.y,calM.m,1);
  const off=(first.getDay()+6)%7; // понеделник първи
  const dim=new Date(calM.y,calM.m+1,0).getDate();
  const t=new Date();
  const tIso=t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');
  const sel=inp.dataset.iso||'';
  let cells=wd.map((w,i)=>`<div style="font-size:11px;color:${i>4?'#9a3a49':'#6b6b63'};text-align:center;padding:4px 0;">${w}</div>`).join('');
  for(let i=0;i<off;i++)cells+='<div></div>';
  for(let d=1;d<=dim;d++){
    const iso=calM.y+'-'+String(calM.m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const st=iso===sel?'background:#82303d;color:#f7f7ee;':(iso===tIso?'box-shadow:inset 0 0 0 1px #82303d;color:#82303d;':'');
    cells+=`<div onclick="pickDate('${iso}')" style="text-align:center;padding:7px 0;border-radius:9px;cursor:pointer;font-size:13px;${st}">${d}</div>`;
  }
  const pop=document.createElement('div');pop.id='acac-cal';
  pop.style.cssText='position:absolute;z-index:999;background:#f4f4e8;border:1px solid #d9d9c4;border-radius:16px;box-shadow:0 10px 26px rgba(0,0,0,.14);padding:12px;width:266px;';
  pop.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
      <button type="button" onclick="calNav(-1)" style="border:0;background:none;cursor:pointer;font-size:17px;padding:4px 12px;">‹</button>
      <b style="font-size:13px;">${months[calM.m]} ${calM.y}</b>
      <button type="button" onclick="calNav(1)" style="border:0;background:none;cursor:pointer;font-size:17px;padding:4px 12px;">›</button></div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;">${cells}</div>
    <div style="display:flex;justify-content:space-between;margin-top:8px;">
      <button type="button" onclick="pickDate('${tIso}')" style="border:0;background:none;cursor:pointer;color:#82303d;font-size:12px;">Днес</button>
      <button type="button" onclick="pickDate('')" style="border:0;background:none;cursor:pointer;color:#6b6b63;font-size:12px;">Изчисти</button></div>`;
  const r=inp.getBoundingClientRect();
  pop.style.left=(r.left+window.scrollX)+'px';pop.style.top=(r.bottom+window.scrollY+6)+'px';
  document.body.appendChild(pop);
  setTimeout(()=>{document.addEventListener('mousedown',calOutside);},0);
}
function calOutside(ev){
  const p=document.getElementById('acac-cal');
  if(p&&!p.contains(ev.target)&&ev.target.id!==calTarget)closeCal();
}
function closeCal(){
  const p=document.getElementById('acac-cal');
  if(p){p.remove();document.removeEventListener('mousedown',calOutside);}
}
function pickDate(iso){
  const inp=document.getElementById(calTarget);
  if(inp){inp.dataset.iso=iso;inp.value=iso?isoToBg(iso):'';}
  closeCal();
}
function editEvent(id){editId=id;tab='events';const e=EVENTS.find(x=>x.id===id);draftAud=e.aud==='all'?['all']:e.aud.slice();draftPubGal=(e.pub&&Array.isArray(e.pub.gallery))?e.pub.gallery.slice():[];draftSlots=(e.pub&&Array.isArray(e.pub.slots))?e.pub.slots.map(x=>({time:x.time||'',cap:Number(x.cap)||0})):[];draftGuests=!!(e.pub&&e.pub.guests);render();window.scrollTo(0,0);}
function cancelEdit(){editId=null;draftAud=['all'];draftPubGal=[];draftSlots=[];draftGuests=false;render();}
async function delEvent(id){if(!confirm('Да изтрия ли събитието?'))return;const ev=EVENTS.find(x=>x.id===id);await DB.deleteEvent(id);DB.logAudit('event_deleted',(ev&&ev.title)||'','');await refresh();render();}

// Бутоните и баджът се смятат на ЕДНО място. Преди setRes() пренаписваше

function resActs(id,st){
  if(!can('reservations'))return '';   // само преглед (счетоводство)
  const del=can('res_delete')?`<button class="btn ghost sm" onclick="delRes('${id}')">Изтрий</button>`:'';
  const mail=s=>`<button class="btn ghost sm" onclick="resendMail('${id}','${s}')">✉ Изпрати отново</button>`;
  if(st==='requested')return `<button class="btn ok sm" onclick="setRes('${id}','confirmed')">Потвърди</button>
    <button class="btn no sm" onclick="setRes('${id}','declined')">Откажи</button>${del}`;
  // връщане на сума (цяла или остатък след частично) — за платени онлайн, докато има какво да се връща
  const r0=RES.find(x=>x.id===id); const canRefund=r0&&r0.stripe_pi&&(r0.paid||r0.refund_cents)&&((r0.paid_cents||0)-(r0.refund_cents||0)>0||(!r0.paid_cents&&!r0.refunded_at));
  const refund=(canRefund&&can('refunds'))?`<button class="btn ghost sm" onclick="refundRes('${id}')">↩ Върни сума</button>`:'';
  if(st==='declined')return `<button class="btn ok sm" onclick="setRes('${id}','confirmed')">Одобри</button>${refund}${mail('declined')}${del}`;
  if(st==='confirmed')return `<button class="btn no sm" onclick="setRes('${id}','declined')">Откажи</button>${refund}${mail('confirmed')}${del}`;
  if(st==='cancelled')return refund+del;       // членът сам е отказал
  if(st==='pending_payment')return del;        // чака плащане — не пипаме
  return del;
}

    ['xl/workbook.xml',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${sheets.map((s,i)=>`<sheet name="${safe(s.name)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')}</sheets></workbook>`],

function walkinTotal(){ const ev=EVENTS.find(e=>e.id===WK.event_id); const price=ev?(Number(ev.price)||0):0; return (WK.pay==='free'||!price)?'0,00 € (безплатно)':(price*(WK.party||1)).toFixed(2).replace('.',',')+' €'; }
function walkinFilter(v){ WK.msearch=v; const sel=document.getElementById('wk_user'); if(!sel)return; const members=(PEOPLE||[]).filter(p=>(p.membership||'guest')!=='guest'); sel.innerHTML=members.filter(p=>!v||((p.full_name||'')+' '+(p.email||'')+' '+(p.username||'')).toLowerCase().includes(v.toLowerCase())).map(p=>`<option value="${p.id}">${esc(p.full_name||p.username||p.email)}${p.email?' · '+esc(p.email):''}</option>`).join(''); }
async function walkinSubmit(){
  const msg=document.getElementById('wk_msg'), b=document.getElementById('wk_go');
  if(!WK.event_id){msg.textContent='Избери събитие.';return;}
  if(WK.who==='member'&&!WK.user_id){msg.textContent='Избери член.';return;}
  if(WK.who==='guest'&&!(WK.name||'').trim()){msg.textContent='Въведи име.';return;}
  b.disabled=true; b.textContent='Издаване…'; msg.textContent='';
  const o={event_id:WK.event_id,party:WK.party||1,pay_method:WK.pay,note:WK.note||'',send_email:!!WK.send};
  if(WK.who==='member')o.user_id=WK.user_id; else {o.name=WK.name.trim();o.email=(WK.email||'').trim();o.phone=(WK.phone||'').trim();}
  const r=await DB.walkinTicket(o);
  if(r&&r.error){ b.disabled=false; b.textContent='Издай билет'; msg.textContent='Грешка: '+r.error.message; return; }
  WK.step='done'; WK.result=r.data; walkinRender();
  try{RES=await DB.listReservations();}catch(e){} renderTabsOnly();
  try{await DB.logAudit('walkin_ticket_issued',r.data.name||'',r.data.title||'');}catch(e){}
}

function resView(){

        ${contact?`<div class="muted" style="margin-top:3px;">${contact}</div>`:''}
        ${r.created_at?`<div class="muted" style="margin-top:3px;font-size:12px;">Направена: ${fmtStamp(r.created_at)}${st==='pending_payment'?(Date.now()-new Date(r.created_at).getTime()>30*60*1000?' · <span style="color:#82303d;">изоставено плащане (над 30 мин.) — мястото е свободно</span>':' · плаща в момента'):''}</div>`:''}
        ${r.ticket_code&&st==='confirmed'?`<div class="muted" style="margin-top:4px;">Билет: <b style="color:var(--text);letter-spacing:1px;">AC2-${r.ticket_code.slice(0,4)}-${r.ticket_code.slice(4)}</b> · <a href="https://ac2.bg/t.html#${r.ticket_code}" target="_blank" rel="noopener" style="color:#82303d;">отвори билета</a> · <a href="#" onclick="event.preventDefault();event.stopPropagation();navigator.clipboard&&navigator.clipboard.writeText('https://ac2.bg/t.html#${r.ticket_code}');toast('Линкът е копиран')" style="color:#82303d;">копирай линка</a></div>`:''}
        ${r.note?`<div class="muted" style="margin-top:4px;">„${esc(r.note)}"</div>`:''}
        <div style="margin-top:7px;" id="resbadge_${r.id}">${badge}${cap}</div></div>

  if(!rows)rows=`<p class="empty">Няма заявки в този раздел.</p>`;
  return `${doorBtn()}<h2>Резервации${resArchive?' — архив':''}</h2>

    <div style="display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 14px;">${chips}${canEvExport()?`<button class="btn ghost sm" style="margin-left:auto;" onclick="exportEvents(null)" title="Всяко събитие на отделен лист + обобщение">⬇ Всички събития (Excel)</button>`:''}</div>

function toast(msg,bad){
  let t=document.getElementById('acac-toast');
  if(!t){t=document.createElement('div');t.id='acac-toast';
    t.style.cssText='position:fixed;left:50%;bottom:28px;transform:translateX(-50%);padding:12px 20px;border-radius:14px;font-size:14px;box-shadow:0 6px 18px rgba(0,0,0,.25);z-index:9999;opacity:0;transition:opacity .25s;max-width:90%;text-align:center;color:#f7f7ee;';
    document.body.appendChild(t);}
  t.style.background=bad?'#82303d':'#507044';
  t.textContent=msg;t.style.opacity='1';
  clearTimeout(t._h);t._h=setTimeout(()=>{t.style.opacity='0';},3500);
}
// „Нова версия — обнови“: взима НАЙ-НОВАТА версия наведнъж (а не междинна от кеша на GitHub Pages)
// 1) разбира кой е последният номер (sw.js без кеш), 2) обновява service worker-а и чисти старите кешове (без снимките),
// 3) зарежда admin.html с ?v=<номер> — уникален адрес, който GitHub/браузърът няма в кеша.
async function adminHardReload(){
  const b1=document.getElementById('newverBtn'); if(b1){b1.disabled=true;b1.textContent='⬆ Обновяване…';}
  let v='';
  try{ const t=await (await fetch('sw.js?'+Date.now(),{cache:'no-store'})).text(); const m=t.match(/acac-v(\d+)/); v=m?m[1]:''; }catch(e){}
  try{ const reg=await navigator.serviceWorker.getRegistration(); if(reg){ await reg.update(); } }catch(e){}
  try{ const ks=await caches.keys(); await Promise.all(ks.filter(k=>k!=='acac-media').map(k=>caches.delete(k))); }catch(e){}
  const u=new URL(location.href); u.searchParams.set('v',v||String(Date.now())); location.replace(u.pathname+u.search+u.hash);
}
async function adminRefresh(){
  const b=document.getElementById('refreshBtn'); if(b){b.disabled=true;b.textContent='↻ …';}
  try{await refresh();}catch(e){}
  if(tab==='messages'){try{MSGS=await DB.listContactMessages();}catch(e){}}
  window._newData=false; try{_stamps=await DB.latestStamps();}catch(e){}
  render();
  toast('Обновено');
}
async function delRes(id){
  if(!confirm('Да изтрия ли тази резервация? Действието е необратимо.'))return;
  const rr=RES.find(x=>x.id===id);
  const r=await DB.deleteReservation(id);
  if(r&&r.error){alert('Грешка при изтриване: '+r.error.message);return;}
  // проверяваме реално дали се изтри (RLS може тихо да върне 0 реда)
  try{
    const fresh=await DB.listReservations();
    if(fresh.some(x=>x.id===id)){ RES=fresh; render(); alert('Резервацията НЕ се изтри (проблем с права в базата). Кажи ми — ще проверя политиките.'); return; }
    RES=fresh;

    return `<div class="card" style="margin-top:8px;">
      <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;"><div><b>${esc(e.title)}</b><div class="muted" style="font-size:12px;">${isoToBg(e.date||'')} ${esc(slots.length?slots.map(x=>x.time).join(', '):(e.time||''))} · ${esc(e.place||'')}</div></div>
        <div style="text-align:right;"><b>${seats}${cap?'/'+cap:''}</b> <span class="muted" style="font-size:12px;">места</span>${pd&&canMoney()?`<div style="font-size:12px;">${eur(pd-rf)}${rf?` <span class="muted">(върнати ${eur(rf)})</span>`:''}</div>`:''}</div></div>

      ${stat('Гости / членове',sum(conf.filter(r=>r.guest),P)+' / '+sum(conf.filter(r=>!r.guest),P),'var(--text)','места')}
      ${stat('Влезли на вратата',sum(conf.filter(r=>r.checked_in_at),P),'#507044','места')}

function csvCell(v){const s=(''+(v??'')).replace(/"/g,'""');return /[",;\n]/.test(s)?`"${s}"`:s;}
// сваля като Excel (.xlsx), с видимо потвърждение (преди беше CSV без съобщение — изглеждаше, че нищо не става)
function csvDownload(name,rows){
  const fname=name+'_'+new Date().toISOString().slice(0,10)+'.xlsx';
  const blob=xlsxBlob([{name:name,head:rows[0],rows:rows.slice(1)}]);
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fname;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  toast('Свален файл: '+fname+' ('+(rows.length-1)+' реда) — виж „Изтегляния“ в браузъра');
}

async function sendAnn(){

  if(annAud==='specific'){a.user_ids=annUserPicked.slice();if(!a.user_ids.length){alert('Избери поне един член.');return;}}
  const r=await DB.createAnnouncement(a);
  if(r&&r.error){alert('Грешка: '+(r.error.message||r.error));return;}
  await DB.logAudit('announcement_posted',title,a.audience==='all'?'до всички':(a.audience==='membership'?'категории: '+a.memberships.join(','):a.user_ids.length+' членове'));
  // push към телефоните (ако е отметнато)
  const pushOn=document.getElementById('annPush')?.checked;
  if(pushOn){
    const sendOne=async(o)=>{const r=await DB.sendPush(Object.assign({title,body:body.slice(0,180),path:'profile'},o));return r;};
    let res;
    if(a.audience==='all')res=await sendOne({audience:'all'});
    else if(a.audience==='specific')res=await sendOne({audience:'users',user_ids:a.user_ids});
    else { let s=0,f=0; for(const m of a.memberships){const r=await sendOne({audience:m,log:false}); if(r&&r.data){s+=r.data.sent||0;f+=r.data.failed||0;}} res={data:{sent:s,failed:f}}; }
    if(res&&res.error)toast('Новината е публикувана, но известието не тръгна: '+res.error.message);
    else if(res&&res.data)toast(`Известие: изпратено до ${res.data.sent||0} устройства${res.data.failed?', неуспешни '+res.data.failed:''}${res.data.note?' · '+res.data.note:''}`);
  }
  annAud='all';annTitleDraft='';annBodyDraft='';annMemPicked=[];annUserPicked=[];annUserFilter='';ANN=await DB.listAnnouncements();render();
}

  const keyOf=a=>{

    if(auditGroup==='month')return {k:t.getFullYear()+'-'+d2(t.getMonth()+1),label:MON[t.getMonth()]+' '+t.getFullYear()};
    const m=new Date(t); m.setHours(0,0,0,0); m.setDate(m.getDate()-((m.getDay()+6)%7));   // понеделник
    const su=new Date(m); su.setDate(m.getDate()+6);
    return {k:m.toISOString().slice(0,10),label:d2(m.getDate())+'.'+d2(m.getMonth()+1)+' – '+d2(su.getDate())+'.'+d2(su.getMonth()+1)+'.'+su.getFullYear()};
  };
  const groups=[]; const idx={};
  AUDIT.forEach(a=>{const g=keyOf(a); if(idx[g.k]===undefined){idx[g.k]=groups.length;groups.push({k:g.k,label:g.label,items:[]});} groups[idx[g.k]].items.push(a);});
  const row=a=>{
    const d=a.created_at?new Date(a.created_at).toLocaleString('bg-BG',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'';
    const act=AL[a.action]||a.action;

  const blocks=groups.map((g,i)=>`<div class="card" style="margin-top:10px;">
      <div style="display:flex;justify-content:space-between;align-items:center;cursor:pointer;" onclick="const t=this.nextElementSibling;const o=t.style.display!=='none';t.style.display=o?'none':'block';this.querySelector('span').textContent=o?'▾':'▴';">
        <b>${esc(g.label)} <span class="muted" style="font-weight:400;">· ${g.items.length}</span></b><span>${i===0?'▴':'▾'}</span></div>
      <table style="width:100%;border-collapse:collapse;font-size:13px;margin-top:8px;display:${i===0?'table':'none'};">
        <tr style="text-align:left;color:var(--muted);"><th>Кога</th><th>Кой</th><th>Действие</th><th>Към</th></tr>${g.items.map(row).join('')}</table></div>`).join('');
  return `<h2>Журнал на действията</h2>
    <div class="tabs" style="margin:6px 0 4px;"><button class="tab ${auditGroup==='week'?'on':''}" onclick="auditGroup='week';render()">По седмици</button><button class="tab ${auditGroup==='month'?'on':''}" onclick="auditGroup='month';render()">По месеци</button></div>
    ${blocks}`;
}

// Редактира текстовете и снимките на публичната страница (само уеб).
// Всичко се пази като един JSON в site_content. Празно поле = текст по подразбиране.
let SITEC=null;
const _dig=(o,p)=>p.split('.').reduce((a,k)=>(a&&a[k]!==undefined)?a[k]:undefined,o||{});
// Стойност за редакция: записаното в базата, а ако липсва — текстът, който сайтът показва сега.
// Така админът вижда реалния текст и просто го поправя, вместо да гледа празни полета.
const sGet=(p)=>{const v=_dig(SITEC,p);const d=_dig(window.SITE_DEFAULTS,p);
  if(v&&typeof v==='object'&&!Array.isArray(v)){return {bg:(v.bg||(d&&d.bg)||''),en:(v.en||(d&&d.en)||'')};}
  return (v!==undefined&&v!==null&&v!=='')?v:(d!==undefined?d:undefined);};
const sSet=(p,v)=>{const ks=p.split('.');let o=SITEC=SITEC||{};ks.slice(0,-1).forEach(k=>{o=o[k]=o[k]||{};});o[ks[ks.length-1]]=v;};
const sid=p=>'s_'+p.replace(/\./g,'_');
// двуезично поле: BG и EN едно до друго
function sBi(label,path,rows){
  const v=sGet(path)||{};
  const inp=(l,val)=>rows
    ?`<textarea id="${sid(path)}_${l}" rows="${rows}" placeholder="${l.toUpperCase()}">${esc(val||'')}</textarea>`
    :`<input id="${sid(path)}_${l}" placeholder="${l.toUpperCase()}" value="${esc(val||'')}"/>`;
  return `<label style="margin-top:10px;">${esc(label)}</label>
    <div class="row2">${inp('bg',v.bg)}${inp('en',v.en)}</div>`;
}
// поле за снимка: показва текущата, качва нова веднага, може да се махне
function sImg(label,path){
  const url=sGet(path)||'';
  return `<label style="margin-top:10px;">${esc(label)}</label>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
      ${url?`<img src="${esc(url)}" style="height:64px;border-radius:10px;object-fit:cover;"/>`:'<span class="muted">няма</span>'}

async function siteUploadVideo(input,path){
  const f=input.files&&input.files[0]; if(!f)return;

// събира всички полета от формата в SITEC
function siteGrab(){
  document.querySelectorAll('[id^="s_"]').forEach(el=>{
    const id=el.id.slice(2);                       // напр. hero_title_bg
    const m=id.match(/^(.*)_(bg|en)$/);
    if(m){ const path=m[1].replace(/_/g,'.'); const cur=sGet(path)||{}; sSet(path,Object.assign({},cur,{[m[2]]:el.value.trim()})); }
    else if(id==='contact_email')sSet('contact.email',el.value.trim());
    else if(id==='contact_phone')sSet('contact.phone',el.value.trim());
    else if(id.startsWith('chk_'))sSet(id.slice(4).replace(/_show_/,'.show_'),el.checked);
    else if(id.startsWith('color_'))sSet(id.slice(6).replace(/_bg_color$/,'.bg_color'),el.value);
  });
}
async function siteUpload(input,path){
  const f=input.files&&input.files[0]; if(!f)return;
  siteGrab();                                        // да не загубим написаното при пречертаване
  toast('Качване…');
  const u=await DB.uploadMedia(f,'site');
  if(u.error){alert('Снимката не се качи: '+u.error.message);return;}
  sSet(path,u.url); render(); toast('Качено — не забравяй „Запази сайта"');
}
async function siteGalAdd(input){
  const files=Array.from(input.files||[]); if(!files.length)return;
  siteGrab(); toast('Качване на '+files.length+' снимки…');
  const list=(sGet('gallery.images')||[]).slice();
  for(const f of files){ const u=await DB.uploadMedia(f,'site'); if(u.error){alert('Снимка не се качи: '+u.error.message);continue;} list.push(u.url); }
  sSet('gallery.images',list); render(); toast('Качено — не забравяй „Запази сайта"');
}
function siteGalDel(i){ siteGrab(); const list=(sGet('gallery.images')||[]).slice(); list.splice(i,1); sSet('gallery.images',list); render(); }
async function saveSite(){
  siteGrab();
  const b=document.getElementById('siteSaveBtn'); if(b){b.disabled=true;b.textContent='Запазване…';}
  const r=await DB.saveSiteContent(SITEC);
  if(b){b.disabled=false;b.textContent='Запази сайта';}
  if(r&&r.error){alert('Не се запази: '+r.error.message);return;}
  try{await DB.logAudit('site_content_saved','','');}catch(e){}
  toast('Сайтът е запазен ✓');
}

const _pdig=(o,p)=>p.split('.').reduce((a,k)=>(a&&a[k]!==undefined&&a[k]!==null)?a[k]:undefined,o||{});

let pubOpen=(()=>{try{return localStorage.getItem('acac_pubtab')||'general';}catch(e){return 'general';}})();
function pField(f,base){
  const path=base?base+'.'+f.k:f.k;
  const lab=`<label style="margin-top:10px;">${esc(f.label)}</label>${f.help?`<div class="muted" style="font-size:12px;margin:-2px 0 4px;">${esc(f.help)}</div>`:''}`;
  if(f.t==='bi'||f.t==='bit'){
    const v=pGet(path)||{};
    const inp=(l,val)=>f.t==='bit'?`<textarea data-p="${path}.${l}" rows="${f.rows||3}" placeholder="${l.toUpperCase()}">${esc(val||'')}</textarea>`:`<input data-p="${path}.${l}" placeholder="${l.toUpperCase()}" value="${esc(val||'')}"/>`;
    return lab+`<div class="row2">${inp('bg',v.bg)}${inp('en',v.en)}</div>`;
  }
  if(f.t==='txt'||f.t==='url'){ const v=pGet(path); return lab+`<input data-p="${path}" value="${esc(v==null?'':v)}" ${f.t==='url'?'placeholder="https://…"':''}/>`; }
  if(f.t==='bool'){ const v=pGet(path); return `<label style="display:flex;gap:8px;align-items:center;font-weight:400;margin-top:10px;"><input type="checkbox" data-p="${path}" data-bool="1" ${v!==false&&v!==undefined?'checked':''}/> ${esc(f.label)}</label>`; }
  if(f.t==='img'){ const url=pGet(path)||'';
    return lab+`<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">${url?`<img src="${esc(url)}" style="height:64px;border-radius:10px;object-fit:cover;"/>`:'<span class="muted">няма</span>'}
      <input type="file" accept="image/*" onchange="pubUpload(this,'${path}')"/>${url?`<button class="btn ghost sm" onclick="pubGrab();pSet('${path}','');render()">Премахни</button>`:''}</div>`; }
  if(f.t==='vid'){ const url=pGet(path)||'';
    return lab+`<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">${url?`<video src="${esc(url)}" muted loop autoplay playsinline style="height:72px;border-radius:10px;background:#000;"></video>`:'<span class="muted">няма</span>'}
      <input type="file" accept="video/mp4,video/webm" onchange="pubUpload(this,'${path}',true)"/>${url?`<button class="btn ghost sm" onclick="pubGrab();pSet('${path}','');render()">Премахни</button>`:''}</div>
      <div class="muted" style="font-size:12px;">MP4/WebM без звук, до 8 MB.</div>`; }
  if(f.t==='imgs'){ const list=(pRaw(path)!==undefined?pRaw(path):(pGet(path)||[])).filter(Boolean);
    return lab+`<div style="display:flex;gap:8px;flex-wrap:wrap;">${list.map((u,i)=>`<div style="position:relative;"><img src="${esc(u)}" style="width:110px;height:82px;object-fit:cover;border-radius:10px;"/>
      <button class="btn no sm" style="position:absolute;top:4px;right:4px;padding:2px 7px;" onclick="pubImgsDel('${path}',${i})">×</button>
      ${i>0?`<button class="btn ghost sm" style="position:absolute;bottom:4px;left:4px;padding:2px 7px;" onclick="pubImgsMove('${path}',${i},-1)">‹</button>`:''}</div>`).join('')}</div>
      <input type="file" accept="image/*" multiple onchange="pubImgsAdd(this,'${path}')" style="margin-top:8px;"/>`; }
  if(f.t==='list'){ const list=pList(path);
    const rows=list.map((it,i)=>`<div class="card" style="margin-top:8px;border-color:#d9d9c4;">
      <div style="display:flex;justify-content:space-between;align-items:center;"><b>${i+1}.</b><div style="display:flex;gap:6px;">
        ${i>0?`<button class="btn ghost sm" onclick="pubListMove('${path}',${i},-1)">↑</button>`:''}${i<list.length-1?`<button class="btn ghost sm" onclick="pubListMove('${path}',${i},1)">↓</button>`:''}
        <button class="btn no sm" onclick="pubListDel('${path}',${i})">Изтрий</button></div></div>
      ${f.fields.map(sf=>pField(sf,path+'.'+i)).join('')}</div>`).join('');
    return `<div style="margin-top:14px;padding-top:10px;border-top:1px dashed #d9d9c4;"><label>${esc(f.label)} (${list.length})</label>${rows}
      ${(!f.max||list.length<f.max)?`<button class="btn ghost sm" style="margin-top:8px;" onclick="pubListAdd('${path}')">+ Добави</button>`:''}</div>`; }
  return '';
}

// събира всички полета в PUBC
function pubGrab(){
  document.querySelectorAll('[data-p]').forEach(el=>{
    if(el.dataset.bool==='1')pSet(el.dataset.p,el.checked);
    else pSet(el.dataset.p,el.value.trim());
  });
  // списъците се материализират в PUBC (за да не изчезнат редовете без полета)
  const walk=(fields,base)=>fields.forEach(f=>{ const path=base?base+'.'+f.k:f.k;
    if(f.t==='list'){ const l=pList(path); pSet(path,l); l.forEach((it,i)=>walk(f.fields,path+'.'+i)); } });
  PUB_SCHEMA.forEach(s=>walk(s.fields,''));
}
async function pubUpload(input,path,isVideo){
  const f=input.files&&input.files[0]; if(!f)return;
  if(isVideo&&f.size>25*1024*1024){alert('Видеото е над 25 MB — компресирай го.');input.value='';return;}
  pubGrab(); toast('Качване…');
  const u=await DB.uploadMedia(f,'site'); if(u.error){alert('Не се качи: '+u.error.message);return;}
  pSet(path,u.url); render(); toast('Качено — не забравяй „Запази"');
}
async function pubImgsAdd(input,path){
  const files=Array.from(input.files||[]); if(!files.length)return;
  pubGrab(); toast('Качване на '+files.length+' снимки…');
  const list=(pRaw(path)!==undefined?pRaw(path):(pGet(path)||[])).slice();
  for(const f of files){ const u=await DB.uploadMedia(f,'site'); if(u.error){alert('Снимка не се качи: '+u.error.message);continue;} list.push(u.url); }
  pSet(path,list); render(); toast('Качено — не забравяй „Запази"');
}
function pubImgsDel(path,i){ pubGrab(); const l=(pRaw(path)!==undefined?pRaw(path):(pGet(path)||[])).slice(); l.splice(i,1); pSet(path,l); render(); }
function pubImgsMove(path,i,d){ pubGrab(); const l=(pRaw(path)!==undefined?pRaw(path):(pGet(path)||[])).slice(); const j=i+d; if(j<0||j>=l.length)return; [l[i],l[j]]=[l[j],l[i]]; pSet(path,l); render(); }
function pubListAdd(path){ pubGrab(); const l=pList(path).slice(); l.push({}); pSet(path,l); render(); }
function pubListDel(path,i){ if(!confirm('Да изтрия ли този запис?'))return; pubGrab(); const l=pList(path).slice(); l.splice(i,1); pSet(path,l); render(); }
function pubListMove(path,i,d){ pubGrab(); const l=pList(path).slice(); const j=i+d; if(j<0||j>=l.length)return; [l[i],l[j]]=[l[j],l[i]]; pSet(path,l); render(); }
async function savePublic(){
  pubGrab(); if(SITEC!==null)siteGrab();
  // Google Maps: ако е залепен целият <iframe …>, вадим само адреса от src
  try{ const g=PUBC.general||{}; if(g.maps_embed){const m=String(g.maps_embed).match(/src\s*=\s*["']([^"']+)["']/); if(m)g.maps_embed=m[1]; g.maps_embed=g.maps_embed.trim();} }catch(e){}
  const b=document.getElementById('pubSaveBtn'); if(b){b.disabled=true;b.textContent='Запазване…';}
  let r=await DB.saveSiteContent(PUBC,'public');
  if(!(r&&r.error)&&SITEC!==null)r=await DB.saveSiteContent(SITEC,'landing');
  if(b){b.disabled=false;b.textContent='Запази публичния сайт';}
  if(r&&r.error){alert('Не се запази: '+r.error.message);return;}
  try{await DB.logAudit('public_site_saved','','');}catch(e){}
  toast('Публичният сайт е запазен ✓');
}

function untilPlus(fieldId,months){
  const f=document.getElementById(fieldId); if(!f)return;
  const today=new Date().toISOString().slice(0,10); const base=(f.dataset.iso&&f.dataset.iso>today)?f.dataset.iso:today;
  const d=new Date(base+'T00:00:00Z'); d.setUTCMonth(d.getUTCMonth()+months); const iso=d.toISOString().slice(0,10);

}

        <button class="btn ghost" style="margin-top:10px;" onclick="doReset()">Генерирай нова парола</button></div>`
    : '';
  const renewCard=DB.live
    ? `<div class="card" style="border-color:var(--gold-soft);">
        <h3>Поднови членство</h3>
        <p class="muted" style="margin:6px 0 8px;">Удължава членството с 1 година от избраната дата (по подразбиране днес).</p>
        <label>Имейл на члена</label><input id="rn_email" type="email" placeholder="name@example.com"/>
        <label>Валидно от</label>
        <input id="rn_from" readonly placeholder="дд.мм.гггг (по подразбиране днес)" data-iso="" onclick="openCal('rn_from')" style="cursor:pointer;"/>
        <button class="btn" style="margin-top:12px;" onclick="doRenew()">Поднови с 1 година</button></div>`
    : '';
  return `<h2>Членове и видимост</h2>
    ${inviteCard}
    ${renewCard}
    ${resetCard}
    <div class="card"><p class="muted" style="margin-bottom:12px;">Колко от текущите събития вижда всяка категория според зададената видимост.</p>
    <table><thead><tr><th>Категория</th><th>Вижда събития</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="card"><p class="muted">Категорията/ролята на всеки член се сменя и в Supabase → Table Editor → profiles.</p></div>`;
}
async function doReset(){
  const email=document.getElementById('rp_email').value.trim();
  if(!email){alert('Въведи имейл');return;}
  const {error,password}=await DB.adminResetPassword(email);
  if(error){alert('Грешка: '+error.message);return;}
  alert('Нова временна парола за '+email+':\n\n'+password+'\n\nДайте я на члена — после може да я смени от профила си.');
  document.getElementById('rp_email').value='';
}
async function doInvite(){
  const email=document.getElementById('iv_email').value.trim();
  if(!email){alert('Въведи имейл');return;}
  const username=document.getElementById('iv_user').value.trim();
  const membership=document.getElementById('iv_mem').value;
  const validFrom=document.getElementById('iv_from').dataset.iso||'';
  const {error,password,until}=await DB.inviteMember(email,username,membership,validFrom);
  if(error){alert('Грешка: '+error.message);return;}
  const untilTxt=until?'\nЧленство валидно до: '+isoToBg(until):'';
  alert((password
    ?('Акаунтът е създаден!\n\nИмейл: '+email+'\nВременна парола: '+password)
    :('Поканата е изпратена на '+email+'.\nЧовекът ще получи имейл с линк, от който сам си задава парола и влиза.'))+untilTxt);
  document.getElementById('iv_email').value='';document.getElementById('iv_user').value='';
}
async function doRenew(){
  const email=document.getElementById('rn_email').value.trim();
  if(!email){alert('Въведи имейл');return;}
  const validFrom=document.getElementById('rn_from').dataset.iso||'';
  const {error,until}=await DB.renewMembership(email,validFrom);
  if(error){alert('Грешка: '+error.message);return;}
  alert('Членството на '+email+' е подновено.\nВалидно до: '+(until?isoToBg(until):'—'));
  document.getElementById('rn_email').value='';
  const f=document.getElementById('rn_from');if(f){f.dataset.iso='';f.value='';}
}

// ================= ЕКИП И ПРАВА (само админ) =================
let teamPick='', teamQ='', teamDraft={};
// търсене без пречертаване на целия екран (иначе курсорът скача в началото)
function teamFoundHtml(){
  const q=teamQ.trim().toLowerCase(); const nm=p=>esc(p.full_name||p.username||p.email||'');
  const found=q?(PEOPLE||[]).filter(p=>!(p.role==='admin'||(p.perms&&p.perms.length))&&((p.full_name||'')+' '+(p.username||'')+' '+(p.email||'')).toLowerCase().includes(q)).slice(0,8):[];
  return found.map(p=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);"><span>${nm(p)} <span class="muted">${esc(p.email||'')}</span></span><button class="btn ghost sm" onclick="teamAdd('${p.id}')">Добави</button></div>`).join('')+(q&&!found.length?'<div class="muted" style="margin-top:6px;">Няма съвпадение.</div>':'');
}
function teamFilter(){ const el=document.getElementById('teamFound'); if(el)el.innerHTML=teamFoundHtml(); }
function teamView(){
  if(!can('team'))return '<p class="empty">Нямате право за екипа.</p>';
  if(PEOPLE===null)return `<h2>Екип</h2><p class="empty">Зареждане…</p>`;
  const todayI=new Date().toISOString().slice(0,10);
  const staff=(PEOPLE||[]).filter(p=>p.role==='admin'||(p.perms&&p.perms.length)).sort((a,b)=>(b.is_owner?2:b.role==='admin'?1:0)-(a.is_owner?2:a.role==='admin'?1:0));
  const nm=p=>esc(p.full_name||p.username||p.email||'');
  const chk=(p,id)=>{const cur=teamDraft[p.id]||p.perms||[];return cur.includes(id);};
  const roleLabel=p=>{ if(p.is_owner)return 'собственик'; if(p.role==='admin')return 'администратор'; const cur=p.perms||[]; const ps=PERM_PRESETS.find(x=>x.p.length===cur.length&&x.p.every(v=>cur.includes(v))); return ps?ps.t:(cur.length+' '+(cur.length===1?'право':'права')); };
  const expired=p=>p.perms_until&&p.perms_until<todayI;
  const card=p=>{
    const isA=p.role==='admin', me=p.id===ME_ID(), open=teamOpen===p.id;
    const head=`<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;cursor:pointer;" onclick="teamToggleOpen('${p.id}')">
        <div><b>${nm(p)}</b> <span class="muted">${esc(p.email||'')}</span>
          <span class="pill" style="${p.is_owner||isA?'border-color:var(--gold);color:var(--gold);':''}margin-left:6px;">${roleLabel(p)}</span>
          ${p.perms_until&&!isA?` <span class="pill" style="${expired(p)?'border-color:#82303d;color:#82303d;':''}">${expired(p)?'изтекли на ':'до '}${isoToBg(p.perms_until)}</span>`:''}
          ${(p.membership||'guest')==='guest'?' <span class="muted" style="font-size:12px;">· без членство</span>':''}</div>
        <span class="muted" style="font-size:12px;">${open?'Свий ▴':'Промени ▾'}</span></div>`;
    if(!open)return `<div class="card" style="margin-top:8px;padding:12px 16px;">${head}</div>`;
    const canTouch=!p.is_owner||me;   // собственикът се пипа само от себе си
    const body=!canTouch?'<div class="muted" style="margin-top:8px;font-size:12px;">Собственикът на клуба — правата му не могат да бъдат променяни от друг.</div>'
      :isA?`<div class="muted" style="margin-top:8px;font-size:12px;">Има всички права.</div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;">${me?'':`<button class="btn ghost sm" onclick="event.stopPropagation();teamSetRole('${p.id}','member')">Махни админ</button>`}</div>`
      :`<div style="display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 6px;">${PERM_PRESETS.map(ps=>`<button class="btn ghost sm" onclick="teamPreset('${p.id}','${ps.id}')">${ps.t}</button>`).join('')}</div>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px 14px;">
          ${PERM_DEFS.map(d=>`<label class="chk" style="display:flex;gap:8px;align-items:flex-start;font-size:13px;${d.ownerOnly&&!IS_OWNER?'opacity:.5;':''}"><input type="checkbox" ${chk(p,d.id)?'checked':''} ${d.ownerOnly&&!IS_OWNER?'disabled':''} onchange="teamToggle('${p.id}','${d.id}',this.checked)"/><span><b style="${d.danger?'color:#82303d;':''}">${d.t}</b><br><span class="muted" style="font-size:11px;">${d.d}</span></span></label>`).join('')}
        </div>
        <div class="row2" style="margin-top:10px;align-items:center;">
          <div><label>Правата важат до (празно = безсрочно)</label><input id="tu_${p.id}" readonly placeholder="безсрочно" value="${p.perms_until?isoToBg(p.perms_until):''}" data-iso="${esc(p.perms_until||'')}" onclick="openCal('tu_${p.id}')" style="cursor:pointer;"/></div>
          <div style="padding-top:22px;"><button class="btn ghost sm" onclick="const i=document.getElementById('tu_${p.id}');i.value='';i.dataset.iso='';">Без срок</button></div></div>
        <div style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap;"><button class="btn sm" onclick="teamSave('${p.id}')">Запази правата</button>
          ${role==='admin'?`<button class="btn ghost sm" onclick="teamSetRole('${p.id}','admin')">Направи админ</button>`:''}
          <button class="btn no sm" onclick="teamRemove('${p.id}')">Премахни от екипа</button></div>`;
    return `<div class="card" style="margin-top:8px;">${head}${body}</div>`;
  };
  const q=teamQ.trim().toLowerCase();
  return `<h2>Екип и права</h2>
    <p class="muted" style="margin-top:-6px;">Администраторът има всичко. За останалите отметни правата (или приложи готов набор). Правата важат и в базата, не само в екрана. Правата в червено са „опасни“ — дават се поотделно. „Заместник-админ“ = всичко без „Екип и права“ и „Членства и цени“.</p>
    ${staff.map(card).join('')}
    <div class="card" style="margin-top:16px;">
      <b>Добави член на клуба към екипа</b>
      <input placeholder="Търси по име / имейл…" value="${esc(teamQ)}" oninput="teamQ=this.value;teamFilter()" style="margin-top:8px;"/>
      <div id="teamFound">${teamFoundHtml()}</div>
    </div>
    <div class="card" style="margin-top:12px;">
      <b>Покани служител по имейл</b> <span class="muted" style="font-size:12px;">(без членство — акаунт само за админ панела)</span>
      <div class="row2" style="margin-top:8px;">
        <div><label>Имейл</label><input id="ts_email" type="email" placeholder="ime@domain.bg"/></div>
        <div><label>Име</label><input id="ts_name" placeholder="Име и фамилия"/></div>
      </div>
      <div class="row2" style="margin-top:8px;"><div><label>Права при поканата</label>
        <select id="ts_preset">${PERM_PRESETS.map(ps=>`<option value="${ps.id}">${ps.t}</option>`).join('')}</select></div>
        <div><label>Важат до (празно = безсрочно)</label><input id="ts_until" readonly placeholder="безсрочно" data-iso="" onclick="openCal('ts_until')" style="cursor:pointer;"/></div></div>
      <div style="margin-top:10px;"><button class="btn sm" onclick="teamInvite()">Изпрати покана</button></div>
    </div>`;
}
let teamOpen=null;
function teamToggleOpen(id){ teamOpen=teamOpen===id?null:id; render(); }
let MY_ID='';
function ME_ID(){ return MY_ID; }
function teamToggle(id,perm,on){ const p=byId(PEOPLE,id); const cur=(teamDraft[id]||p.perms||[]).slice(); const i=cur.indexOf(perm); if(on&&i<0)cur.push(perm); if(!on&&i>=0)cur.splice(i,1); teamDraft[id]=cur; }
function teamPreset(id,ps){ const pr=PERM_PRESETS.find(x=>x.id===ps); if(!pr)return; teamDraft[id]=pr.p.slice(); render(); }
async function teamSave(id){
  const perms=teamDraft[id]||(byId(PEOPLE,id).perms||[]);
  const ui=document.getElementById('tu_'+id); const until=ui?(ui.dataset.iso||''):'';
  const r=await DB.setPerms(id,perms,until); if(r.error){alert('Грешка: '+r.error.message);return;}
  delete teamDraft[id]; toast('Правата са записани'); PEOPLE=await DB.listMembers(); render();
}
async function teamRemove(id){
  if(!confirm('Да премахна този човек от екипа? Акаунтът му остава, но губи достъп до админа.'))return;
  const r=await DB.setPerms(id,[]); if(r.error){alert('Грешка: '+r.error.message);return;}
  delete teamDraft[id]; toast('Премахнат от екипа'); PEOPLE=await DB.listMembers(); render();
}
async function teamAdd(id){ teamDraft[id]=PERM_PRESETS.find(x=>x.id==='reception').p.slice(); teamQ=''; const r=await DB.setPerms(id,teamDraft[id]); if(r.error){alert('Грешка: '+r.error.message);return;} delete teamDraft[id]; PEOPLE=await DB.listMembers(); render(); toast('Добавен към екипа (Рецепция) — коригирай правата, ако трябва'); }
async function teamSetRole(id,roleNew){
  if(!confirm(roleNew==='admin'?'Да направя този човек администратор (всички права, вкл. екипа)?':'Да махна админ правата?'))return;
  const r=await DB.setRole(id,roleNew); if(r.error){alert('Грешка: '+r.error.message);return;}
  toast('Записано'); PEOPLE=await DB.listMembers(); render();
}
async function teamInvite(){
  const email=(document.getElementById('ts_email').value||'').trim(), name=(document.getElementById('ts_name').value||'').trim();
  const ps=PERM_PRESETS.find(x=>x.id===document.getElementById('ts_preset').value)||PERM_PRESETS.find(x=>x.id==='reception');
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){alert('Невалиден имейл');return;}
  const uu=document.getElementById('ts_until'); const until=uu?(uu.dataset.iso||''):'';
  const r=await DB.inviteStaff(email,name,ps.p,until); if(r.error){alert('Грешка: '+r.error.message);return;}
  toast(r.data&&r.data.existed?'Акаунтът вече съществуваше — правата са зададени':'Поканата е изпратена'); PEOPLE=await DB.listMembers(); render();
}
function gate(){
  const live=DB.live;
  root.innerHTML=`<div class="gate">
    <div class="ring"><span>AC²</span></div>
    <h1>Админ панел</h1>
    <div class="f">
      <input id="a_user" placeholder="${live?'Имейл':'Потребителско име'}" onkeydown="if(event.key==='Enter')doLogin()"/>
      <input id="a_pass" type="password" placeholder="Парола" onkeydown="if(event.key==='Enter')doLogin()"/>
      <button class="btn" style="width:100%;" onclick="doLogin()">Вход</button>
      <div class="muted" style="margin-top:12px;">${live?'Вход с админ акаунт (role=admin)':'Демо достъп: <span style="color:var(--gold);">admin / admin</span>'}</div>
    </div></div>`;
}
async function doLogin(){
  const u=document.getElementById('a_user').value;
  const p=document.getElementById('a_pass').value;
  if(DB.live){
    const {error}=await DB.signIn(u,p);
    if(error){alert('Грешен вход: '+error.message);return;}
    const me=await DB.getUser();
    MY_ID=me?me.id:''; PERMS=(me&&me.perms)||[]; if(me&&me.role==='editor'&&!PERMS.length)PERMS=['events','news','site','messages'];
    if(!me||(me.role!=='admin'&&!PERMS.length)){alert('Този акаунт няма права за админ панела.');await DB.signOut();return;}
    role=me.role;admin=true;if(!tabAllowed(tab))tab=firstTab();await refresh();render();
  }else{
    if((u||'').trim().toLowerCase()!=='admin'||(p||'').trim()!=='admin'){alert('Грешно име или парола');return;}
    admin=true;role='admin';localStorage.setItem('acac_admin','1');await refresh();render();
  }
}
async function logout(){
  _loggingOut=true;
  try{ if(DB.live)await DB.signOut(); else localStorage.removeItem('acac_admin'); }
  finally{ admin=false;role='';render(); setTimeout(()=>{_loggingOut=false;},1500); }
}
boot();
</script>
<script>if('serviceWorker' in navigator){
  // Админът НИКОГА не се презарежда сам (незаписани промени!). При нова версия — лента с бутон „Обнови“; ти избираш кога.
  const _had=!!navigator.serviceWorker.controller;   // при първо отваряне (без стар worker) няма лента
  // Нова версия → бутон „⬆ Нова версия — обнови“ в горната лента (и лента долу). Показва се само тогава.
  const _bar=()=>{
    window._newVer=true;
    const nb=document.getElementById('newverBtn'); if(nb)nb.style.display='inline-block';
    if(document.getElementById('swbar'))return; const b=document.createElement('div'); b.id='swbar';
    b.style.cssText='position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:99999;background:#1b1b1b;color:#ebebd6;border:1px solid #c9a86a;border-radius:24px;padding:10px 16px;font-size:13px;display:flex;gap:12px;align-items:center;box-shadow:0 8px 28px rgba(0,0,0,.35);';
    b.innerHTML='Налична е нова версия на админа <button onclick="adminHardReload()" style="background:#c9a86a;color:#1b1b1b;border:0;border-radius:16px;padding:6px 12px;font-weight:600;cursor:pointer;">Обнови</button>';
    document.body.appendChild(b); };
  // Проверка за нова версия — НЕ зависи от service worker-а (при Ctrl+F5 страницата е без worker и старата логика мълчеше):
  // на всеки 2 мин., при връщане в таба и при клик (≥15 s) теглим sw.js от сървъра и сравняваме номера на версията
  // с този при зареждането. Различен → бутон „⬆ Нова версия — обнови“. Service worker-ът се регистрира отделно.
  let _ver=null;
  const readVer=async()=>{ try{ const t=await (await fetch('sw.js?'+Date.now(),{cache:'no-store'})).text(); const m=t.match(/acac-v(\d+)/); return m?parseInt(m[1],10):null; }catch(e){ return null; } };
  const chk=async()=>{ const v=await readVer(); if(v==null)return; if(_ver==null){_ver=v;return;} if(v>_ver)_bar(); };
  window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); chk(); });
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible')chk(); });
  let lastChk=Date.now(); document.addEventListener('click',()=>{ if(Date.now()-lastChk>15000){lastChk=Date.now();chk();} },true);
  setInterval(chk,2*60*1000);
  navigator.serviceWorker.addEventListener('controllerchange',()=>{ if(_had)_bar(); });
}</script>

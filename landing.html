<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>AC² — American College Arcus Club · Велико Търново</title>
<meta name="description" content="Ново градско място за култура, изкуство, гастрономия, идеи и срещи във Велико Търново. Абонирай се за нюзлетъра ни, за да бъдеш в час с датата и програмата за откриването." />
<meta property="og:title" content="AC² — American College Arcus Club" />
<meta property="og:description" content="Ново градско място за култура, изкуство, гастрономия, идеи и срещи във Велико Търново." />
<meta property="og:image" content="https://ac2.bg/cards/logo-ac2.webp" />
<meta property="og:url" content="https://ac2.bg/" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://twcxfqgknhqicxqghcrx.supabase.co https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; base-uri 'self'; form-action 'self';" />
<meta name="theme-color" content="#EBEBD6" />
<link rel="icon" href="favicon.png" />
<link rel="manifest" href="manifest.json" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Google+Sans+Flex:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  /* Бранд гайд: бежово #EBEBD6, бордо #82303D, зелено #507044, черно. Заглавия — Playfair Display Bold Italic; текст/бутони — Google Sans. */
  :root{ --beige:#EBEBD6; --wine:#82303D; --wine-dark:#652430; --green:#507044; --ink:#1c1c1b; --muted:#5f5f55; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--beige);color:var(--ink);font-family:"Google Sans Flex","Google Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{min-height:100%;display:grid;grid-template-columns:1fr 1fr}
  .left{background:var(--beige);display:flex;flex-direction:column;justify-content:space-between;align-items:center;text-align:center;padding:clamp(28px,6vh,72px) clamp(20px,6vw,80px);min-height:100vh;min-height:100dvh}
  .logo{width:clamp(150px,22vw,290px);height:auto;display:block;margin:clamp(20px,8vh,96px) auto 0}
  .logo svg{width:100%!important;height:auto!important;display:block;color:var(--ink)}
  .mid{flex:1;display:flex;flex-direction:column;justify-content:center;gap:clamp(40px,9vh,120px);width:100%;max-width:820px}
  h1{font-family:"Playfair Display",Georgia,serif;font-weight:700;font-style:italic;font-size:clamp(27px,3.2vw,48px);line-height:1.18;letter-spacing:0;color:var(--ink)}
  .sub{font-weight:400;font-size:clamp(17px,1.6vw,26px);line-height:1.3;color:var(--ink)}
  .sub b{font-weight:700;color:var(--wine)}
  form{width:100%;max-width:850px;display:flex;gap:clamp(12px,1.6vw,26px);margin:clamp(20px,4vh,44px) auto 0}
  input[type=email]{flex:1;min-width:0;height:clamp(46px,5.4vw,62px);border:1.5px solid var(--ink);border-radius:12px;padding:0 18px;font:inherit;font-size:clamp(15px,1.2vw,19px);background:#fff;color:var(--ink);outline:none}
  input[type=email]:focus{box-shadow:0 0 0 3px rgba(130,48,61,.25)}
  button{flex:0 0 clamp(120px,12.5vw,240px);height:clamp(46px,5.4vw,62px);border:0;border-radius:10px;background:var(--wine);color:var(--beige);font:inherit;font-weight:500;font-size:clamp(14px,1.1vw,18px);cursor:pointer;transition:background .15s}
  button:hover{background:var(--wine-dark)} button:disabled{opacity:.6;cursor:default}
  .fine{font-size:12px;color:var(--muted);margin-top:12px;line-height:1.5}
  .fine a{color:inherit}
  .msg{min-height:22px;margin-top:10px;font-size:15px;font-weight:500;color:var(--wine)}
  .msg.ok{color:var(--green)}
  .cap{display:flex;justify-content:center;margin-top:8px;min-height:0}
  .right{position:relative;overflow:hidden;background:var(--wine)}
  .right img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top;display:block}
  @media (max-width:860px){
    .wrap{grid-template-columns:1fr}
    .right{order:-1;height:62vw;max-height:520px}
    .left{min-height:0;padding:28px 22px 32px}
    .logo{margin-top:4px}
    .mid{gap:30px}
    form{flex-direction:column;gap:12px}
    button{flex:0 0 auto;height:50px}
  }
  @media (prefers-reduced-motion:no-preference){ .left>*{animation:fade .6s ease both} .right{animation:fade .9s ease both} @keyframes fade{from{opacity:0}to{opacity:1}} }
</style>
</head>
<body>
<div class="wrap">
  <section class="left">
    <div class="logo" id="logo" aria-label="AC²"></div>
    <div class="mid">
      <h1 lang="bg">Ново градско място за култура, изкуство, гастрономия, идеи и срещи във Велико Търново</h1>
      <div>
        <p class="sub"><b>Абонирай се</b> за нюзлетъра ни, за да бъдеш в час с датата и програмата за откриването!</p>
        <form id="nl" novalidate>
          <input type="email" name="email" autocomplete="email" inputmode="email" placeholder="Твоят имейл" aria-label="Имейл" required />
          <button type="submit" id="btn">Абонирай се</button>
        </form>
        <div class="cap" id="cap"></div>
        <div class="msg" id="msg" role="status" aria-live="polite"></div>
        <p class="fine">С абонирането се съгласяваш да получаваш имейли от AC² и приемаш <a href="index.html?site=1#/legal/privacy" target="_blank" rel="noopener">политиката за поверителност</a>. Отписване — по всяко време.</p>
      </div>
    </div>
    <div></div>
  </section>
  <aside class="right" aria-hidden="true">
    <img src="cards/contour-red.webp" alt="" />
  </aside>
</div>

<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
<script src="config.js"></script>
<script src="brand.js"></script>
<script>
(function(){
  var CFG=window.ACAC_CONFIG||{};
  try{ document.getElementById('logo').innerHTML=(window.LOGO_SVG||'').replace(/ style="[^"]*"/,''); }catch(e){}
  var msg=document.getElementById('msg'), btn=document.getElementById('btn'), form=document.getElementById('nl');
  function say(t,ok){ msg.textContent=t||''; msg.className='msg'+(ok?' ok':''); }

  // Turnstile (невидим, показва се само ако Cloudflare поиска проверка)
  var tsId=null;
  function mountCaptcha(){
    if(!CFG.TURNSTILE_SITE_KEY||!window.turnstile||tsId!==null) return;
    tsId=turnstile.render('#cap',{sitekey:CFG.TURNSTILE_SITE_KEY,theme:'light',appearance:'interaction-only',retry:'auto','refresh-expired':'auto',
      'error-callback':function(){try{turnstile.reset(tsId);}catch(e){}return true;}});
  }
  window.onloadTurnstileCallback=mountCaptcha;
  var tries=0, tm=setInterval(function(){ mountCaptcha(); if(tsId!==null||++tries>40) clearInterval(tm); },250);
  function token(){ try{ return tsId!==null?turnstile.getResponse(tsId):''; }catch(e){ return ''; } }

  form.addEventListener('submit', async function(ev){
    ev.preventDefault();
    var email=(form.email.value||'').trim();
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)){ say('Моля, въведи валиден имейл.'); form.email.focus(); return; }
    var tok=token();
    if(CFG.TURNSTILE_SITE_KEY&&!tok){ say('Моля, изчакай секунда за проверката и опитай пак.'); mountCaptcha(); return; }
    btn.disabled=true; var old=btn.textContent; btn.textContent='Момент…'; say('');
    try{
      var r=await fetch(CFG.SUPABASE_URL+'/functions/v1/public-forms',{method:'POST',
        headers:{'Content-Type':'application/json','apikey':CFG.SUPABASE_ANON_KEY,'Authorization':'Bearer '+CFG.SUPABASE_ANON_KEY},
        body:JSON.stringify({kind:'newsletter',email:email,lang:'bg',consent:true,source:'landing',captcha_token:tok})});
      var j={}; try{ j=await r.json(); }catch(e){}
      if(!r.ok||j.error){
        say(j.error==='captcha'?'Проверката изтече — опитай отново.':(j.error||'Нещо се обърка. Опитай пак след малко.'));
      } else {
        form.reset(); say('Благодарим! Ще ти пишем, щом обявим датата на откриването.',true);
      }
    }catch(e){ say('Няма връзка. Опитай пак след малко.'); }
    btn.disabled=false; btn.textContent=old;
    try{ if(tsId!==null) turnstile.reset(tsId); }catch(e){}
  });

  if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(function(){}); }
})();
</script>
</body>
</html>

<title>AC² · Маси</title>
<link rel="icon" href="favicon.png?v=3" />
<link rel="stylesheet" href="fonts/fonts.css" />
<style>
:root{
  --bg:#EBEBD6; --panel:#F4F4E8; --card:#F9F9F1; --ink:#1C1C1B; --mid:#4B4B45; --muted:#75756B;
  --line:rgba(28,28,27,.13); --line2:#CFCFBB; --wine:#82303D; --wine2:#652430; --wineT:rgba(130,48,61,.15);
  --green:#507044; --greenT:rgba(80,112,68,.14); --amber:#B97A1F; --amberT:rgba(201,138,43,.16); --grey:#BFC0C2;
  --floor:#E4E4CC; --grid:rgba(28,28,27,.055); --grid2:rgba(28,28,27,.10); --tbl:#FBFBF5; --chair:#D3D3BE; --chairS:#B9B9A3;
  --top:#000; --topInk:#EBEBD6; --shadow:0 1px 0 rgba(0,0,0,.04),0 6px 20px rgba(28,28,27,.08);
  --serif:'Playfair Display','Playfair',Georgia,serif; --sans:'Google Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --side:372px;
}
[data-theme="dark"]{
  --bg:#121211; --panel:#191917; --card:#21211E; --ink:#EBEBD6; --mid:#C4C4B4; --muted:#8E8E82;
  --line:rgba(235,235,214,.11); --line2:#33332E; --wine:#C0596A; --wine2:#9E4252; --wineT:rgba(192,89,106,.16);
  --green:#7FA36F; --greenT:rgba(127,163,111,.16); --amber:#D9A04A; --amberT:rgba(217,160,74,.16); --grey:#55554F;
  --floor:#171715; --grid:rgba(235,235,214,.04); --grid2:rgba(235,235,214,.08); --tbl:#2A2A26; --chair:#3A3A35; --chairS:#4A4A43;
  --top:#000; --shadow:0 8px 24px rgba(0,0,0,.45);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.4;overflow:hidden;
  -webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;}
input,select,textarea{-webkit-user-select:text;user-select:text;}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:0;cursor:pointer;}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--wine);outline-offset:2px;}
#app{height:100dvh;display:flex;flex-direction:column;}

/* ---------- горна лента ---------- */
.top{flex:0 0 auto;display:flex;align-items:center;gap:14px;padding:0 16px;padding-top:env(safe-area-inset-top);height:calc(62px + env(safe-area-inset-top));
  background:var(--top);color:var(--topInk);}
.brand{color:inherit;text-decoration:none;display:flex;align-items:baseline;gap:8px;white-space:nowrap;}
.brand b{font-family:var(--serif);font-style:italic;font-weight:700;font-size:21px;}
.brand span{font-size:13px;opacity:.6;}
.datenav{display:flex;align-items:center;gap:2px;margin-left:8px;}
.datenav .ar{width:40px;height:40px;border-radius:20px;display:grid;place-items:center;font-size:20px;opacity:.85;}
.datenav .ar:hover{background:rgba(235,235,214,.1);}
.datenav .d{position:relative;padding:6px 12px;border-radius:10px;font-weight:500;min-width:168px;text-align:center;}
.datenav .d small{display:block;font-size:11px;opacity:.55;font-weight:400;}
.datenav .d input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;}
.today{border:1px solid rgba(235,235,214,.3);border-radius:18px;padding:6px 12px;font-size:13px;}
.today[disabled]{opacity:.35;cursor:default;}
.seg{display:flex;background:rgba(235,235,214,.09);border-radius:12px;padding:3px;margin-left:auto;}
.seg button{padding:8px 16px;border-radius:9px;font-size:14px;color:rgba(235,235,214,.7);white-space:nowrap;}
.seg button.on{background:var(--topInk);color:#000;font-weight:600;}
.ibtn{width:42px;height:42px;border-radius:21px;display:grid;place-items:center;color:var(--topInk);opacity:.85;flex:0 0 auto;}
.ibtn:hover{background:rgba(235,235,214,.1);opacity:1;}
.ibtn.on{background:var(--wine);opacity:1;}
.ibtn svg{width:21px;height:21px;}
.ibtn.edtxt{width:auto;padding:0 14px 0 12px;gap:8px;display:flex;border:1px solid rgba(235,235,214,.25);font-size:14px;}
@media (max-width:1100px){.ibtn.edtxt span{display:none;}.ibtn.edtxt{width:42px;padding:0;justify-content:center;border:0;}}
.live{width:8px;height:8px;border-radius:4px;background:#6f9a5f;box-shadow:0 0 0 3px rgba(111,154,95,.25);flex:0 0 auto;}
.live.off{background:#888;box-shadow:none;}

/* ---------- втора лента: зали + час ---------- */
.sub{flex:0 0 auto;display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--bg);}
.zones{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:0 1 auto;}
.zones::-webkit-scrollbar{display:none;}
.zbtn{padding:8px 14px;border-radius:20px;border:1px solid var(--line);white-space:nowrap;font-size:14px;color:var(--mid);display:flex;gap:7px;align-items:center;}
.zbtn i{font-style:normal;font-size:12px;color:var(--muted);}
.zbtn.on{background:var(--ink);color:var(--bg);border-color:var(--ink);}
.zbtn.on i{color:var(--bg);opacity:.65;}
.evchip{display:flex;align-items:center;gap:6px;max-width:260px;padding:7px 12px;border-radius:20px;border:1.5px solid var(--wine);color:var(--wine);font-size:13px;white-space:nowrap;flex:0 1 auto;min-width:0;}
.evchip em{font-style:normal;overflow:hidden;text-overflow:ellipsis;color:var(--mid);}
.evchip.on{background:var(--wine);color:#F7F7EE;} .evchip.on em{color:#F7F7EE;opacity:.85;}
.evchip svg{width:14px;height:14px;flex:0 0 auto;}
.msgs{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--amber);border-radius:14px;padding:10px 12px;margin-bottom:10px;}
.msgs .mi{padding:9px 0;border-top:1px solid var(--line);}
.msgs .mi:first-of-type{border-top:0;}
.msgs .mi p{font-size:13px;color:var(--mid);margin:3px 0 8px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
.newres{display:flex;gap:8px;}
.newres .search{min-width:0;flex:1 1 auto;}
.newres .btn{flex:0 0 auto;}
.savest{font-size:13.5px;color:var(--green);white-space:nowrap;}
.savest.busy{color:var(--muted);} .savest.bad{color:var(--wine);font-weight:600;}
.donebtn{background:var(--wine);color:#F7F7EE;border-radius:21px;padding:0 18px;height:42px;font-weight:600;white-space:nowrap;}
.phead{position:sticky;top:-14px;z-index:3;display:flex;justify-content:space-between;align-items:center;gap:8px;margin:-14px -16px 12px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);}
.zbtn.add{border-style:dashed;color:var(--muted);}
.scrub{display:flex;align-items:center;gap:10px;margin-left:auto;flex:1 1 360px;max-width:520px;}
.scrub .t{font-family:var(--serif);font-style:italic;font-weight:700;font-size:22px;min-width:64px;text-align:right;color:var(--ink);}
.scrub input[type=range]{flex:1;accent-color:var(--wine);height:32px;}
.nowbtn{font-size:13px;padding:6px 12px;border-radius:16px;border:1px solid var(--line);color:var(--mid);white-space:nowrap;}
.nowbtn.on{border-color:var(--green);color:var(--green);}

/* ---------- основна част ---------- */
.main{flex:1;display:flex;min-height:0;position:relative;}
.stage{flex:1;position:relative;min-width:0;overflow:hidden;background:var(--floor);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px),
    linear-gradient(var(--grid2) 1px,transparent 1px),linear-gradient(90deg,var(--grid2) 1px,transparent 1px);
  background-size:20px 20px,20px 20px,100px 100px,100px 100px;}
.stage.edit{background-color:color-mix(in srgb,var(--floor) 88%,var(--wine) 12%);}
.floor{position:absolute;inset:0;width:100%;height:100%;touch-action:none;}
.room{fill:var(--floor);stroke:var(--ink);stroke-width:3;opacity:.9;}
[data-theme="dark"] .room{stroke:#56564e;}
.roomlabel{font-family:var(--serif);font-style:italic;font-size:15px;fill:var(--muted);}

/* маси */
.tb{cursor:pointer;}
.tb .body{fill:var(--tbl);stroke:var(--chairS);stroke-width:1.5;transition:fill .25s,stroke .25s;}
.tb .ch{fill:var(--chair);stroke:var(--chairS);stroke-width:1;transition:fill .25s;}
.tb .ch.x{fill:none;stroke:var(--wine);stroke-dasharray:3 2;}
.tb .num{font-family:var(--serif);font-style:italic;font-weight:700;font-size:22px;fill:var(--ink);text-anchor:middle;dominant-baseline:central;pointer-events:none;}
.tb .cap{font-size:11px;fill:var(--muted);text-anchor:middle;dominant-baseline:central;pointer-events:none;}
.tb .hitc{fill:transparent;}
.tb .cbar{fill:var(--ink);}
.tb.sel .cbar,.edit .tb.sel .cbar{fill:var(--wine);}
.tb.fit .cbar{fill:var(--green);animation:pulse 1.4s ease-in-out infinite;}
.tb.drop .cbar{fill:var(--wine);}
.tb .stl{fill:var(--tbl);stroke:var(--chairS);stroke-width:1.5;}
.tb .stl.g{fill:var(--green);stroke:var(--green);} .tb .stl.r{fill:var(--wine);stroke:var(--wine);} .tb .stl.b{fill:url(#hatch);stroke:var(--ink);}
.tb .clbl{font-size:15px;font-weight:600;fill:var(--ink);dominant-baseline:central;pointer-events:none;}
.tb .who{font-size:12.5px;font-weight:600;fill:var(--ink);text-anchor:middle;dominant-baseline:central;pointer-events:none;}
.tb .when{font-size:11px;fill:var(--mid);text-anchor:middle;dominant-baseline:central;pointer-events:none;}
.tb.st-reserved .body{fill:var(--wine);stroke:var(--wine);stroke-width:2;}
.tb.st-reserved .ch{fill:color-mix(in srgb,var(--chair) 45%,var(--wine) 55%);stroke:var(--wine);}
.tb.st-reserved .num,.tb.st-reserved .who,.tb.st-reserved .cap{fill:#F7F7EE;}
.tb.st-reserved .when{fill:#F7F7EE;opacity:.8;}
.tb.st-soon .body{fill:var(--amber);stroke:var(--amber);stroke-width:2;}
.tb.st-soon .ch{fill:color-mix(in srgb,var(--chair) 45%,var(--amber) 55%);}
.tb.st-soon .num,.tb.st-soon .who,.tb.st-soon .when,.tb.st-soon .cap{fill:#1C1C1B;}
.tb.st-seated .body{fill:var(--green);stroke:var(--green);}
.tb.st-seated .ch{fill:color-mix(in srgb,var(--green) 55%,var(--chair) 45%);stroke:var(--green);}
.tb.st-seated .num,.tb.st-seated .who,.tb.st-over .who{fill:#F4F4E8;}
.tb.st-seated .when,.tb.st-over .when{fill:#F4F4E8;opacity:.8;}
.tb.st-seated .cap{fill:#F4F4E8;opacity:.85;}
.tb.st-over .body{fill:var(--green);stroke:var(--amber);stroke-width:3;stroke-dasharray:6 4;}
.tb.st-over .num,.tb.st-over .cap{fill:#F4F4E8;}
.tb.st-block .body{fill:url(#hatch);stroke:var(--ink);stroke-width:2;stroke-dasharray:6 4;}
.tb.st-block .ch{fill:var(--grey);}
.tb .tag{fill:var(--card);stroke:var(--line2);}
.tb.inactive{opacity:.35;}
.tb.sel .body{stroke:var(--ink);stroke-width:3;}
.tb.fit .body{stroke:var(--green);stroke-width:3;animation:pulse 1.4s ease-in-out infinite;}
.tb.nofit{opacity:.32;}
.tb.drop .body{stroke:var(--wine);stroke-width:4;}
@keyframes pulse{50%{stroke-opacity:.35;}}
@media (prefers-reduced-motion:reduce){.tb.fit .body{animation:none;}}
.chip rect{fill:var(--ink);}
.chip text{fill:var(--bg);font-size:12px;font-weight:500;dominant-baseline:central;}
.chip.res rect{fill:var(--wine);} .chip.res text{fill:#F7F7EE;}
.chip.soon rect{fill:var(--amber);} .chip.soon text{fill:#1c1c1b;}
.chip.seated rect{fill:var(--card);stroke:var(--green);stroke-width:1.2;} .chip.seated text{fill:var(--ink);}
.chip.block rect{fill:var(--card);stroke:var(--muted);} .chip.block text{fill:var(--mid);}
.joinline{stroke:var(--wine);stroke-width:2;stroke-dasharray:5 5;fill:none;opacity:.7;}
/* декор */
.dec .bar{fill:var(--ink);} .dec .bartxt{fill:var(--bg);font-family:var(--serif);font-style:italic;font-size:22px;letter-spacing:.06em;text-anchor:middle;dominant-baseline:central;}
.dec .stage{fill:var(--wineT);stroke:var(--wine);stroke-width:1.5;} .dec .stagetxt{fill:var(--wine);font-family:var(--serif);font-style:italic;font-size:16px;text-anchor:middle;dominant-baseline:central;}
.dec .wall{fill:var(--ink);} .dec .hit{fill:transparent;stroke:none;} .edit .dec .hit{stroke:var(--line2);stroke-dasharray:4 4;} .dec .win{fill:var(--floor);stroke:var(--ink);stroke-width:1.5;}
.dec .door{fill:none;stroke:var(--ink);stroke-width:1.5;} .dec .lbl{fill:var(--muted);font-size:11px;text-anchor:middle;}
.dec .plant{fill:color-mix(in srgb,var(--green) 70%,transparent);}
.edit .tb,.edit .dec{cursor:grab;}
.edit .dec{pointer-events:all;}
.dec{pointer-events:none;}
.edit .sel .body,.edit .dec.sel>*:first-child{stroke:var(--wine);stroke-width:3;}
.handle{fill:var(--wine);stroke:#fff;stroke-width:2;cursor:nwse-resize;}
.selbox{fill:none;stroke:var(--wine);stroke-width:1.5;stroke-dasharray:6 4;pointer-events:none;}

/* банери на събития и легенда върху схемата */
.overlay{position:absolute;left:16px;right:16px;top:14px;display:flex;flex-direction:column;gap:8px;pointer-events:none;align-items:flex-start;}
.evbanner{pointer-events:auto;display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--wine);
  border-radius:12px;padding:9px 12px;box-shadow:var(--shadow);max-width:100%;}
.evbanner b{font-weight:600;} .evbanner .m{color:var(--muted);font-size:13px;}
.legend{position:absolute;left:16px;bottom:14px;display:flex;gap:14px;flex-wrap:wrap;background:color-mix(in srgb,var(--card) 88%,transparent);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:22px;padding:7px 14px;font-size:12.5px;color:var(--mid);}
.legend span{display:flex;align-items:center;gap:6px;}
.legend i{width:12px;height:12px;border-radius:4px;display:inline-block;border:1.5px solid var(--chairS);background:var(--tbl);}
.legend i.r{border-color:var(--wine);background:var(--wine);} .legend i.s{border-color:var(--amber);background:var(--amber);}
.legend i.g{border-color:var(--green);background:var(--green);} .legend i.b{background:repeating-linear-gradient(45deg,var(--grey) 0 2px,transparent 2px 5px);border-color:var(--muted);}
.zoom{position:absolute;right:16px;bottom:14px;display:flex;flex-direction:column;gap:6px;z-index:4;}
.zoom button{width:44px;height:44px;border-radius:22px;background:color-mix(in srgb,var(--card) 92%,transparent);border:1px solid var(--line);box-shadow:var(--shadow);font-size:20px;color:var(--ink);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);}
.zoom button.fit{font-size:12px;}
.scroller{position:absolute;inset:0;overflow:hidden;}
.stage.zoomed .scroller{overflow:auto;-webkit-overflow-scrolling:touch;}
.stage.zoomed .floor{touch-action:pan-x pan-y;}
.stage.zoomed .legend{display:none;}
.stage.zoomed.edit .floor{touch-action:none;}
.dec .txt{fill:var(--ink);font-family:var(--sans);text-anchor:middle;dominant-baseline:central;opacity:.82;}
.dec .ln{fill:var(--ink);}
.assignbar{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:24px;padding:10px 10px 10px 18px;
  display:flex;gap:12px;align-items:center;box-shadow:var(--shadow);z-index:5;white-space:nowrap;max-width:calc(100% - 32px);}
.assignbar button{background:rgba(235,235,214,.15);border-radius:16px;padding:6px 12px;font-size:13px;}
.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--muted);padding:40px;}
.empty h3{font-family:var(--serif);font-style:italic;font-size:24px;color:var(--ink);margin-bottom:6px;}

/* ---------- страничен панел ---------- */
.side{flex:0 0 var(--side);width:var(--side);background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;}
.sidehead{padding:14px 16px 10px;border-bottom:1px solid var(--line);}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:12px;}
.stat{padding:6px 0;}
.stat b{display:block;font-family:var(--serif);font-style:italic;font-weight:700;font-size:24px;line-height:1.1;}
.stat span{font-size:11.5px;color:var(--muted);}
.search{display:flex;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 12px;height:42px;}
.search input{flex:1;border:0;background:transparent;font:inherit;color:var(--ink);outline:none;min-width:0;}
.filters{display:flex;gap:6px;margin-top:10px;overflow-x:auto;scrollbar-width:none;}
.filters button{padding:6px 11px;border-radius:16px;font-size:13px;border:1px solid var(--line);color:var(--mid);white-space:nowrap;}
.filters button.on{background:var(--wine);border-color:var(--wine);color:#F7F7EE;}
.filters button em{font-style:normal;opacity:.7;margin-left:3px;}
.list{flex:1;overflow-y:auto;padding:10px 12px 90px;-webkit-overflow-scrolling:touch;}
.grp{font-size:12.5px;color:var(--muted);margin:14px 4px 6px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;}
.grp:first-child{margin-top:4px;}
.rc{display:flex;gap:10px;align-items:stretch;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 10px 10px 12px;margin-bottom:8px;cursor:pointer;position:relative;}
.rc:hover{border-color:var(--line2);}
.rc.sel{border-color:var(--wine);box-shadow:0 0 0 2px var(--wineT);}
.rc.seated{border-left:4px solid var(--green);}
.rc.assigned{border-left:4px solid var(--wine);}
.rc.req{border-left:4px solid var(--amber);}
.rc .tm{font-family:var(--serif);font-style:italic;font-weight:700;font-size:20px;min-width:52px;line-height:1.15;}
.rc .tm small{display:block;font-family:var(--sans);font-style:normal;font-weight:400;font-size:12px;color:var(--muted);}
.rc .bd{flex:1;min-width:0;}
.rc .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rc .mt{font-size:12.5px;color:var(--muted);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.rc .note{font-size:12.5px;color:var(--mid);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.grip{width:30px;display:grid;place-items:center;color:var(--muted);touch-action:none;cursor:grab;border-radius:8px;margin:-4px -4px -4px 0;}
.grip:hover{background:var(--line);}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:2px 8px;border-radius:10px;background:var(--line);color:var(--mid);white-space:nowrap;}
.pill.w{background:var(--wineT);color:var(--wine);} .pill.g{background:var(--greenT);color:var(--green);} .pill.a{background:var(--amberT);color:var(--amber);}
.pill.t{background:var(--ink);color:var(--bg);font-family:var(--serif);font-style:italic;font-weight:700;}
.ghost{position:fixed;z-index:100;pointer-events:none;background:var(--wine);color:#F7F7EE;border-radius:14px;padding:8px 14px;box-shadow:0 10px 30px rgba(0,0,0,.25);font-weight:600;transform:translate(-50%,-120%);white-space:nowrap;}

/* детайл в панела */
.det{flex:1;overflow-y:auto;padding:14px 16px 100px;}
.back{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:14px;margin-bottom:10px;padding:4px 0;}
.det h2{font-family:var(--serif);font-style:italic;font-weight:700;font-size:30px;line-height:1.1;}
.det .sub2{color:var(--muted);margin:4px 0 14px;font-size:14px;}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px;}
.box h4{font-size:13px;color:var(--muted);font-weight:500;margin-bottom:8px;}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.stepper{display:flex;align-items:center;gap:4px;background:var(--bg);border-radius:22px;padding:3px;}
.stepper button{width:38px;height:38px;border-radius:19px;background:var(--card);border:1px solid var(--line);font-size:20px;line-height:1;}
.stepper b{min-width:34px;text-align:center;font-size:18px;}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 14px;border-radius:12px;font-weight:600;
  background:var(--ink);color:var(--bg);text-align:center;line-height:1.2;}
.btn.w{background:var(--wine);color:#F7F7EE;} .btn.g{background:var(--green);color:#F7F7EE;}
.btn.o{background:transparent;border:1px solid var(--line2);color:var(--ink);}
.btn.d{background:transparent;border:1px solid var(--wine);color:var(--wine);}
.btn.full{grid-column:1/-1;width:100%;}
.btn.sm{min-height:36px;padding:6px 12px;font-size:13px;border-radius:10px;}
.btn[disabled]{opacity:.4;pointer-events:none;}
.sl{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);cursor:pointer;}
.sl:first-of-type{border-top:0;}
.sl .tt{font-weight:600;min-width:94px;font-size:14px;}
.sl .nn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.dot{width:9px;height:9px;border-radius:5px;flex:0 0 auto;background:var(--wine);}
.dot.seated{background:var(--green);} .dot.block{background:var(--grey);} .dot.done{background:transparent;border:1.5px solid var(--muted);}
.sugg{display:flex;gap:8px;flex-wrap:wrap;}
.sugg button{border:1.5px solid var(--green);color:var(--green);border-radius:12px;padding:8px 12px;font-weight:600;text-align:left;line-height:1.2;}
.sugg button small{display:block;font-weight:400;font-size:11.5px;color:var(--muted);}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px;}
.kv span{color:var(--muted);}
.kv a{color:var(--wine);}
.muted{color:var(--muted);}

/* редактор */
.pal{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
.pal button{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 4px 6px;font-size:11.5px;color:var(--mid);display:flex;flex-direction:column;align-items:center;gap:4px;}
.pal button:hover{border-color:var(--wine);}
.pal svg{width:40px;height:30px;}
.pal svg *{fill:var(--tbl);stroke:var(--chairS);stroke-width:1.5;}
.pal svg .c{fill:var(--chair);}
.pal svg .k{fill:var(--ink);stroke:none;}
.fld{display:block;margin-bottom:10px;}
.fld>span{display:block;font-size:12.5px;color:var(--muted);margin-bottom:4px;}
.inp{width:100%;height:42px;border:1px solid var(--line2);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;padding:0 12px;}
textarea.inp{height:70px;padding:10px 12px;resize:vertical;}
.shapes{display:flex;gap:6px;flex-wrap:wrap;}
.shapes button{border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:13px;}
.shapes button.on{border-color:var(--wine);background:var(--wineT);color:var(--wine);}
.tog{display:flex;align-items:center;justify-content:space-between;padding:8px 0;}
.sw{width:46px;height:28px;border-radius:14px;background:var(--line2);position:relative;transition:background .2s;flex:0 0 auto;}
.sw::after{content:'';position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:11px;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2);}
.sw.on{background:var(--green);} .sw.on::after{left:21px;}

/* ---------- по часове ---------- */
.tlwrap{flex:1;overflow:auto;position:relative;background:var(--bg);-webkit-overflow-scrolling:touch;}
.tl{position:relative;min-width:max-content;padding-bottom:90px;}
.tlhead{position:sticky;top:0;z-index:4;display:flex;background:var(--bg);border-bottom:1px solid var(--line);}
.tlcorner{position:sticky;left:0;z-index:5;background:var(--bg);width:var(--lab);flex:0 0 var(--lab);border-right:1px solid var(--line);padding:8px 12px;font-size:12px;color:var(--muted);display:flex;align-items:flex-end;}
.hrs{position:relative;height:56px;}
.hr{position:absolute;top:0;bottom:0;border-left:1px solid var(--line);padding:6px 0 0 6px;font-size:13px;font-weight:600;}
.hr small{display:block;font-weight:400;font-size:11px;color:var(--muted);margin-top:4px;}
.cov{position:absolute;bottom:4px;height:14px;border-radius:3px;background:var(--wineT);}
.tlzone{display:flex;position:relative;background:color-mix(in srgb,var(--bg) 70%,var(--panel));border-bottom:1px solid var(--line);}
.tlzone .lab{position:sticky;left:0;z-index:3;width:var(--lab);flex:0 0 var(--lab);padding:10px 12px;font-family:var(--serif);font-style:italic;font-weight:700;font-size:16px;background:inherit;border-right:1px solid var(--line);}
.tlrow{display:flex;position:relative;border-bottom:1px solid var(--line);height:54px;}
.tlrow .lab{position:sticky;left:0;z-index:3;width:var(--lab);flex:0 0 var(--lab);padding:0 12px;display:flex;align-items:center;gap:8px;background:var(--panel);border-right:1px solid var(--line);cursor:pointer;}
.tlrow .lab b{font-family:var(--serif);font-style:italic;font-size:19px;min-width:30px;}
.tlrow .lab span{font-size:12px;color:var(--muted);}
.lane{position:relative;flex:0 0 auto;}
.lane .q{position:absolute;top:0;bottom:0;border-left:1px dashed var(--line);}
.lane .h{position:absolute;top:0;bottom:0;border-left:1px solid var(--line);}
.blk{position:absolute;top:6px;bottom:6px;border-radius:10px;padding:5px 9px;overflow:hidden;font-size:12.5px;line-height:1.25;cursor:grab;touch-action:none;
  background:var(--wineT);border:1.5px solid var(--wine);color:var(--ink);white-space:nowrap;}
.blk b{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;}
.blk span{color:var(--muted);font-size:11.5px;}
.blk.seated{background:var(--green);border-color:var(--green);color:#F4F4E8;}
.blk.seated span{color:#F4F4E8;opacity:.8;}
.blk.walkin{background:color-mix(in srgb,var(--green) 22%,var(--card));border-color:var(--green);}
.blk.walkin.seated{background:var(--green);}
.blk.block{background:repeating-linear-gradient(45deg,var(--card) 0 6px,color-mix(in srgb,var(--grey) 55%,transparent) 6px 12px);border-color:var(--muted);}
.blk.done{opacity:.45;border-style:dashed;}
.blk.drag{opacity:.85;box-shadow:0 10px 26px rgba(0,0,0,.2);z-index:6;cursor:grabbing;}
.blk.conf{border-color:var(--amber);box-shadow:0 0 0 2px var(--amberT);}
.evband{position:absolute;top:7px;bottom:7px;border-radius:8px;background:var(--wine);color:#F7F7EE;font-size:12.5px;padding:4px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.nowline{position:absolute;top:0;bottom:0;width:2px;background:var(--wine);z-index:2;pointer-events:none;}
.nowline::before{content:'';position:absolute;top:0;left:-4px;width:10px;height:10px;border-radius:5px;background:var(--wine);}
.slotcur{position:absolute;top:6px;bottom:6px;border-radius:10px;border:1.5px dashed var(--wine);pointer-events:none;}

/* ---------- лист (модал) ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s;}
.sheet{background:var(--panel);width:min(560px,100%);max-height:88dvh;overflow-y:auto;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));
  box-shadow:0 -10px 40px rgba(0,0,0,.2);animation:up .22s cubic-bezier(.2,.8,.2,1);}
@media (min-width:760px){.scrim{align-items:center;}.sheet{border-radius:22px;}}
.sheet h3{font-family:var(--serif);font-style:italic;font-weight:700;font-size:24px;margin-bottom:2px;}
.sheet .lead{color:var(--muted);font-size:14px;margin-bottom:14px;}
.sheet .foot{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;}
.sheet .foot .btn{flex:1;}
.nums{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;}
.nums button{height:52px;border-radius:12px;border:1px solid var(--line2);background:var(--card);font-size:18px;font-weight:600;}
.nums button.on{background:var(--ink);color:var(--bg);border-color:var(--ink);}
.chips{display:flex;gap:6px;flex-wrap:wrap;}
.chips button{padding:8px 12px;border-radius:18px;border:1px solid var(--line2);font-size:14px;background:var(--card);}
.chips button.on{background:var(--ink);color:var(--bg);border-color:var(--ink);}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.pickrow{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:12px;margin-bottom:6px;cursor:pointer;background:var(--card);}
.pickrow:hover{border-color:var(--wine);}
@keyframes up{from{transform:translateY(30px);opacity:0}}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){.sheet,.scrim{animation:none;}}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:22px;z-index:200;font-size:14px;box-shadow:var(--shadow);max-width:calc(100% - 32px);}
.toast.err{background:var(--wine);color:#fff;}

/* вход */
.gate{flex:1;display:grid;place-items:center;padding:24px;}
.gate .card{width:min(380px,100%);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:26px;}
.gate h1{font-family:var(--serif);font-style:italic;font-size:30px;margin-bottom:4px;}
.gate p{color:var(--muted);margin-bottom:16px;font-size:14px;}
.gate .inp{margin-bottom:10px;}

/* ---------- таблет портрет / телефон: панелът става долен лист ---------- */
.sidetoggle{display:none;}
@media (max-width:980px){
  :root{--side:340px;}
  .brand span{display:none;}
}
@media (max-width:860px){
  .side{position:absolute;left:0;right:0;bottom:0;width:auto;height:62%;border-left:0;border-top:1px solid var(--line);border-radius:20px 20px 0 0;
    box-shadow:0 -10px 30px rgba(0,0,0,.14);transform:translateY(calc(100% - 66px));transition:transform .28s cubic-bezier(.2,.8,.2,1);z-index:10;}
  .side.open{transform:none;}
  .sidetoggle{display:flex;justify-content:center;padding:8px 0 0;cursor:pointer;}
  .sidetoggle i{width:42px;height:5px;border-radius:3px;background:var(--line2);}
  .legend{bottom:80px;}
  .scrub{flex-basis:220px;}
  .datenav .d{min-width:130px;}
  .top{gap:6px;padding:0 10px;}
  .sub{flex-wrap:wrap;gap:8px;}
  .scrub{order:2;max-width:none;flex:1 1 100%;margin:0;}
}
@media (max-width:560px){
  .brand{display:none;}
  .legend{display:none;}
  .datenav .ar{width:30px;}
  .datenav .d{min-width:0;padding:6px 4px;}
  .ibtn{width:36px;height:36px;}
  .live{display:none;}
  .datenav .d{white-space:nowrap;font-size:14px;}
  .zoom{bottom:84px;}
  .seg button{padding:8px 10px;}
  .datenav{margin-left:0;}
  .today{display:none;}
}
@media print{.top,.sub,.side,.legend{display:none;}}

<body>
<div id="app"></div>
<script src="vendor/supabase.js"></script>
<script src="config.js"></script>
<script src="db.js"></script>
<script>
'use strict';
/* =====================================================================
   AC² · Маси — схема на залите, настаняване, дневен изглед по часове
   Данни (Supabase): floor_zones, floor_tables, floor_seatings (SQL 2026-11-08-tables.sql)
   + reservations / events (четене; потвърждение и „присъства“ както в админа)
   Демо без база: tables.html?demo=1
   ПРАВИЛО ЗА СИГУРНОСТ: никакъв потребителски текст в on*-атрибути — само data-id + делегиране.
   ===================================================================== */
const DEMO = /[?&]demo=1/.test(location.search) || !DB.live;
const sb = !DEMO && DB.client ? DB.client() : null;
const $ = s => document.querySelector(s);
const app = document.getElementById('app');
const esc = s => String(s == null ? '' : s).replace(/[&<>"'`]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;','`':'&#96;'}[c]));
const pad = n => String(n).padStart(2, '0');
const tm = t => { if (!t) return null; const m = String(t).match(/^(\d{1,2}):(\d{2})/); return m ? (+m[1]) * 60 + (+m[2]) : null; };
const fm = m => { m = Math.max(0, Math.min(24 * 60, Math.round(m))); return pad(Math.floor(m / 60)) + ':' + pad(m % 60); };
const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const todayIso = () => iso(new Date());
const nowMin = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };
const addDays = (s, n) => { const d = new Date(s + 'T12:00:00'); d.setDate(d.getDate() + n); return iso(d); };
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : 'x' + Date.now() + Math.random().toString(16).slice(2));
const MONTHS = ['януари','февруари','март','април','май','юни','юли','август','септември','октомври','ноември','декември'];
const DAYS = ['неделя','понеделник','вторник','сряда','четвъртък','петък','събота'];
const bgDate = s => { const d = new Date(s + 'T12:00:00'); return { day: DAYS[d.getDay()], date: d.getDate() + ' ' + MONTHS[d.getMonth()] }; };
const plural = (n, one, many) => n + ' ' + (n === 1 ? one : many);
const snap15 = m => Math.round(m / 15) * 15;

// ---------- настройки на устройството ----------
const CFG_KEY = 'acac_tables_cfg';
let CFG = { open: '11:00', close: '24:00', d2: 90, d4: 120, d9: 150, theme: '' };
try { Object.assign(CFG, JSON.parse(localStorage.getItem(CFG_KEY) || '{}')); } catch (e) {}
const saveCfg = () => { try { localStorage.setItem(CFG_KEY, JSON.stringify(CFG)); } catch (e) {} };
const dur = p => (p || 2) <= 2 ? CFG.d2 : (p <= 4 ? CFG.d4 : CFG.d9);
const OPEN = () => tm(CFG.open) ?? 660, CLOSE = () => tm(CFG.close) ?? 1440;
function applyTheme() {
  const t = CFG.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', t);
  const m = document.querySelector('meta[name=theme-color]'); if (m) m.content = '#000000';
}
applyTheme();

// ---------- състояние ----------
let ME = null, CAN_LAYOUT = false, MAIN = null;   // MAIN = кога е запазен основният план
let ZONES = [], TABLES = [], SEATS = [], RES = [], EVENTS = [], ALLEV = [];
const S = { zoom: 1, date: todayIso(), view: 'floor', zone: null, at: nowMin(), follow: true, edit: false,
  sel: null,            // {t:'table'|'res'|'seat'|'zone', id}
  assign: null,         // id на резервация, която чака избор на маса
  filter: 'todo', q: '', side: false, openGroups: {} };
try { const v = localStorage.getItem('acac_tables_view'); if (v === 'time' || v === 'floor') S.view = v; S.zoom = Math.max(1, Math.min(3, +localStorage.getItem('acac_tables_zoom') || 1)); } catch (e) {}

// =====================================================================
//  ДАННИ
// =====================================================================
const api = {
  async load() {
    if (DEMO) { demoInit(); return; }
    const [z, t] = await Promise.all([
      sb.from('floor_zones').select('*').order('sort').order('created_at'),
      sb.from('floor_tables').select('*')
    ]);
    if (z.error) throw z.error; if (t.error) throw t.error;
    ZONES = z.data || []; TABLES = t.data || [];
    try { const m = await sb.from('floor_layouts').select('saved_at,saved_name').eq('id', 'main').maybeSingle(); MAIN = m.error ? null : m.data; } catch (e) { MAIN = null; }
    try { ALLEV = await DB.listEvents(); } catch (e) { ALLEV = []; }
  },
  async loadDay() {
    EVENTS = ALLEV.filter(e => e.date === S.date || (e.end_date && e.date <= S.date && e.end_date >= S.date));
    if (DEMO) { demoDay(); return; }
    const s = await sb.from('floor_seatings').select('*').eq('date', S.date);
    if (s.error) throw s.error;
    SEATS = s.data || [];
    const ids = EVENTS.map(e => e.id).filter(x => /^[0-9a-f-]{36}$/.test(x));
    let or = 'date.eq.' + S.date;
    if (ids.length) or += ',event_id.in.(' + ids.join(',') + '),table_event_id.in.(' + ids.join(',') + ')';
    const r = await sb.from('reservations').select('*').or(or);
    if (r.error) throw r.error;
    let rows = r.data || [];
    // резервации, вече сложени на маса за деня, но с друга дата (рядко) — дърпаме ги също
    const miss = [...new Set(SEATS.map(x => x.reservation_id).filter(id => id && !rows.some(y => y.id === id)))];
    if (miss.length) { const m = await sb.from('reservations').select('*').in('id', miss); rows = rows.concat(m.data || []); }
    RES = rows.map(mapRes).filter(Boolean);
    try { const since = new Date(Date.now() - 21 * 864e5).toISOString();
      const m = await sb.from('contact_messages').select('id,name,email,phone,subject,message,is_read,created_at').eq('is_read', false).gte('created_at', since).order('created_at', { ascending: false }).limit(40);
      MSGS = m.error ? [] : (m.data || []); } catch (e) { MSGS = []; }
  },
  async up(table, row) {
    if (DEMO) return { data: row };
    const { data, error } = await sb.from(table).upsert(row).select().single();
    if (error) throw error; return { data };
  },
  async upMany(table, rows) {
    if (DEMO || !rows.length) return;
    const { error } = await sb.from(table).upsert(rows); if (error) throw error;
  },
  async del(table, id) {
    if (DEMO) return;
    const { error } = await sb.from(table).delete().eq('id', id); if (error) throw error;
  }
};
function mapRes(r) {
  if (r.kind && r.kind !== 'physical') return null;
  const ev = r.event_id ? ALLEV.find(e => e.id === r.event_id) : null;
  const after = r.table_event_id ? ALLEV.find(e => e.id === r.table_event_id) : null;
  let time = r.time || (ev && ev.time) || (after && (after.ends || after.time)) || '';
  if (!tm(time)) time = '';
  return { id: r.id, user_id: r.user_id, name: r.res_name || r.guest_name || r.who || 'Гост', party: r.party_size || 1,
    date: r.date || (ev && ev.date) || (after && after.date) || S.date, time, status: r.status || 'requested',
    event_id: r.event_id || null, table_event_id: r.table_event_id || null, paid: !!r.paid, checked_in_at: r.checked_in_at || '',
    note: r.note || '', phone: r.contact_phone || r.guest_phone || '', email: r.contact_email || r.guest_email || '',
    membership: r.membership || (r.user_id ? '' : 'guest'), place: (window.placeName ? placeName(r.place) : r.place) || '',
    fmt: r.format || '', code: r.ticket_code || '', grp: r.event_id ? 'event' : (r.table_event_id ? 'after' : 'rest'),
    evTitle: ev ? ev.title : (after ? after.title : '') };
}
const MEMNAME = { founder: 'Founder', founding: 'Founding', club: 'Club', alumni: 'Alumni', corporate: 'Corporate', guest: 'Гост' };

// ---------- изчисления ----------
const zoneTables = (zid, all) => TABLES.filter(t => t.zone_id === zid && (all || t.kind === 'table'));
const tableById = id => TABLES.find(t => t.id === id);
const resById = id => RES.find(r => r.id === id);
const seatById = id => SEATS.find(s => s.id === id);
const seatsOfRes = id => SEATS.filter(s => s.reservation_id === id);
const tLabel = t => t ? (t.label || '?') : '?';
const tName = t => !t ? '?' : (t.shape === 'counter' || t.shape === 'counter2') ? (t.label || 'Бар') : 'Маса ' + (t.label || '?');
const zoneOfPlace = p => ZONES.find(z => z.place && p && z.place === p);
function seatName(s) { if (s.reservation_id) { const r = resById(s.reservation_id); if (r) return r.name; } return s.name || (s.kind === 'block' ? 'Запазена' : 'Гост на място'); }
function seatParty(s) { if (s.reservation_id) { const r = resById(s.reservation_id); if (r) return r.party; } return s.party || 0; }
// бар от двете страни: колко столчета са горе (пази се в min_party — за бара не се ползва иначе)
const cTop = t => { const n = t.seats || 0; if (t.shape !== 'counter2') return 0; const v = t.min_party; return Math.max(0, Math.min(n, v > 1 || n <= 3 ? (v || 0) : Math.ceil(n / 2))); };
const isCounter = t => !!t && (t.shape === 'counter' || t.shape === 'counter2');
// какво пречи на нов запис за [a,b). При бар/тепаняки — само ако местата не стигат (или е запазен изцяло)
function overlaps(tid, a, b, exceptId, party) {
  const t = tableById(tid);
  if (isCounter(t)) {
    const L = SEATS.filter(s => s.table_id === tid && s.id !== exceptId && s.status !== 'done' && tm(s.start_t) < b && a < tm(s.end_t));
    const blocks = L.filter(s => s.kind === 'block'); if (blocks.length) return blocks;

const PPM = () => innerWidth < 700 ? 1.3 : 1.7; // пиксели на минута
function timelineHtml() {
  const o = OPEN(), c = CLOSE(), ppm = PPM(), W = (c - o) * ppm, lab = innerWidth < 700 ? 92 : 132;
  let hrs = '';
  // гости по половин час (за кухнята и сервиза)
  const cover = [];
  for (let m = o; m < c; m += 30) {
    const g = SEATS.filter(s => s.status !== 'done' && s.kind !== 'block' && tm(s.start_t) <= m && m < tm(s.end_t)).reduce((a, s) => a + (s.reservation_id ? (seatsOfRes(s.reservation_id)[0] === s ? seatParty(s) : 0) : (s.party || 0)), 0);
    cover.push([m, g]);
  }
  const maxG = Math.max(1, ...cover.map(x => x[1]));
  for (let m = Math.ceil(o / 60) * 60; m < c; m += 60) { const g = (cover.find(x => x[0] === m) || [0, 0])[1]; hrs += `<div class="hr" style="left:${(m - o) * ppm}px;width:${60 * ppm}px">${pad(m / 60)}:00<small>${g ? plural(g, 'гост', 'гости') : ''}</small></div>`; }
  cover.forEach(([m, g]) => { if (g) hrs += `<div class="cov" style="left:${(m - o) * ppm + 2}px;width:${30 * ppm - 4}px;opacity:${.25 + .75 * g / maxG}"></div>`; });
  let grid = '';
  for (let m = Math.ceil(o / 15) * 15; m < c; m += 15) grid += `<div class="${m % 60 ? 'q' : 'h'}" style="left:${(m - o) * ppm}px"></div>`;
  const nowX = S.date === todayIso() && nowMin() >= o && nowMin() <= c ? (nowMin() - o) * ppm : -1;
  let rows = '';
  ZONES.filter(z => z.active !== false).forEach(z => {
    const tt = zoneTables(z.id).filter(t => t.active !== false).sort((a, b) => String(a.label).localeCompare(String(b.label), 'bg', { numeric: true }));
    if (!tt.length) return;
    const evs = EVENTS.filter(e => e.place && z.place === e.place && tm(e.time) != null);
    rows += `<div class="tlzone"><div class="lab">${esc(z.name)}</div><div class="lane" style="width:${W}px;height:${evs.length ? 40 : 36}px">${evs.map(e => { const a = tm(e.time), b = tm(e.ends) || a + 120; return `<div class="evband" style="left:${(a - o) * ppm}px;width:${Math.max(40, (b - a) * ppm)}px">${esc(e.time)} ${esc(e.title)}</div>`; }).join('')}</div></div>`;
    tt.forEach(t => {
      const ss = SEATS.filter(s => s.table_id === t.id).sort((a, b) => tm(a.start_t) - tm(b.start_t));
      const ends = []; const lane = {};
      ss.forEach(s => { let k = ends.findIndex(e => e <= tm(s.start_t)); if (k < 0) { k = ends.length; ends.push(0); } ends[k] = tm(s.end_t); lane[s.id] = k; });
      const nl = Math.max(1, ends.length), H = 42;
      rows += `<div class="tlrow" data-row="${t.id}" style="height:${nl * (H + 4) + 8}px"><div class="lab" data-a="table" data-id="${t.id}"><b${isCounter(t) ? ' style="font-size:15px"' : ''}>${esc(t.label)}</b><span>${t.seats} м.</span></div>
        <div class="lane" data-lane="${t.id}" style="width:${W}px">${grid}${ss.map(s => blkHtml(s, o, ppm, 6 + lane[s.id] * (H + 4), H)).join('')}</div></div>`;
    });
  });
  if (!rows) rows = `<div class="empty" style="position:static;padding:60px;"><div><h3>Още няма маси</h3><p>Начертай залата от изгледа „Схема“.</p></div></div>`;
  return `<div class="tlwrap" id="tlwrap" style="--lab:${lab}px"><div class="tl">
    <div class="tlhead"><div class="tlcorner">Маса</div><div class="hrs" style="width:${W}px">${hrs}</div></div>
    ${rows}
    ${nowX >= 0 ? `<div class="nowline" style="left:${lab + nowX}px"></div>` : ''}
  </div></div>`;
}
function blkHtml(s, o, ppm, top, hh) {
  const a = tm(s.start_t), b = tm(s.end_t);
  const conflict = overlaps(s.table_id, a, b, s.id, seatParty(s)).length > 0;
  const cls = 'blk ' + (s.kind === 'block' ? 'block' : s.kind === 'walkin' ? 'walkin' : '') + (s.status === 'seated' ? ' seated' : '') + (s.status === 'done' ? ' done' : '') + (conflict ? ' conf' : '');
  const p = seatParty(s);
  return `<div class="${cls}" data-blk="${s.id}" style="left:${(a - o) * ppm + 1}px;width:${Math.max(24, (b - a) * ppm - 2)}px;${top != null ? `top:${top}px;bottom:auto;height:${hh}px;` : ''}"><b>${esc(seatName(s))}${p ? ' · ' + p : ''}</b><span>${s.start_t}–${s.end_t}</span></div>`;
}
function afterTimeline() {
  const w = $('#tlwrap'); if (!w) return;
  if (S._tlScroll != null) { w.scrollLeft = S._tlScroll; w.scrollTop = S._tlScrollY || 0; }
  else { const n = nowMin(); const base = S.date === todayIso() && n > OPEN() + 60 && n < CLOSE() ? n - 90 : 17 * 60; w.scrollLeft = Math.max(0, (base - OPEN()) * PPM()); }
  w.addEventListener('scroll', () => { S._tlScroll = w.scrollLeft; S._tlScrollY = w.scrollTop; }, { passive: true });
}

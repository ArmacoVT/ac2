<svg viewBox="0 0 400 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AC² Culture">
<style>
*{stroke-linecap:round;stroke-linejoin:round}
.l{fill:none;stroke:#1c1c1b;stroke-width:2}
.w{stroke:#82303D} .g{stroke:#507044} .fw{fill:#82303D;stroke:none} .fg{fill:#507044;stroke:none}
.d{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.3s cubic-bezier(.4,0,.2,1) forwards}
.d2{animation-delay:.35s} .d3{animation-delay:.7s} .d4{animation-delay:1.05s} .d5{animation-delay:1.4s}
.fi{opacity:0;animation:fade .8s ease forwards} .fi2{animation-delay:1.3s} .fi3{animation-delay:1.7s}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{to{opacity:1}}
.breathe{transform-box:fill-box;transform-origin:center;animation:br 6s ease-in-out infinite}
@keyframes br{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}
.head{transform-box:fill-box;transform-origin:bottom center;animation:tilt 7s ease-in-out infinite}
@keyframes tilt{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(5deg)}}
.leaf{transform-box:fill-box;transform-origin:bottom center;animation:leaf 5s ease-in-out infinite}
@keyframes leaf{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.sun{transform-box:fill-box;transform-origin:center;animation:sun 10s linear infinite}
@keyframes sun{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;stroke-dashoffset:0!important;opacity:1!important}}
</style>

<path class="l d" pathLength="1" d="M20 140 h360"/>
<!-- голяма картина -->
<g class="breathe"><path class="l d d2" pathLength="1" d="M150 28 h150 v92 h-150 z M158 36 h134 v76 h-134 z"/>
<path class="l d d3 g" pathLength="1" d="M166 104 l34 -40 l20 24 l16 -18 l40 34"/>
<g class="sun"><path class="l d d4 w" pathLength="1" d="M262 58 m-9 0 a9 9 0 1 0 18 0 a9 9 0 1 0 -18 0 M262 44 v-4 M262 72 v4 M248 58 h-4 M276 58 h4"/></g></g>
<!-- малка картина -->
<path class="l d d3" pathLength="1" d="M318 48 h56 v44 h-56 z M326 56 h40 v28 h-40 z"/>
<path class="l d d4 w" pathLength="1" d="M332 80 c6 -14 14 -14 20 0 M352 70 c4 -8 8 -8 12 0" />
<!-- зрител -->
<g class="fi fi2"><path class="l" d="M86 140 c0 -24 10 -34 24 -34 s24 10 24 34"/>
<g class="head"><path class="l" d="M110 104 m-12 0 a12 12 0 1 0 24 0 a12 12 0 1 0 -24 0 M100 96 c6 -8 14 -8 20 0"/></g></g>
<!-- растение -->
<g class="fi fi3"><path class="l w" d="M30 140 v-16 h22 v16"/>
<g class="leaf"><path class="l g" d="M41 124 v-26 M41 110 c-10 -2 -14 -10 -14 -18 c8 0 14 6 14 18 M41 104 c10 -2 14 -10 14 -18 c-8 0 -14 6 -14 18"/></g></g>

</svg>
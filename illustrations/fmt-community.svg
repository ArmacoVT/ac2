<svg viewBox="0 0 400 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AC² Arcus Community">
<style>
*{stroke-linecap:round;stroke-linejoin:round}
.l{fill:none;stroke:#1c1c1b;stroke-width:2}
.w{stroke:#82303D} .g{stroke:#507044} .fw{fill:#82303D;stroke:none} .fg{fill:#507044;stroke:none}
.d{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.3s cubic-bezier(.4,0,.2,1) forwards}
.d2{animation-delay:.35s} .d3{animation-delay:.7s} .d4{animation-delay:1.05s} .d5{animation-delay:1.4s}
.fi{opacity:0;animation:fade .8s ease forwards} .fi2{animation-delay:1.3s} .fi3{animation-delay:1.7s}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{to{opacity:1}}
.p{transform-box:fill-box;transform-origin:bottom center;animation:bob 3.2s ease-in-out infinite}
.p2{animation-delay:-.6s}.p3{animation-delay:-1.2s}.p4{animation-delay:-1.8s}.p5{animation-delay:-2.4s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.sun{transform-box:fill-box;transform-origin:center;animation:sun 14s linear infinite}
@keyframes sun{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;stroke-dashoffset:0!important;opacity:1!important}}
</style>

<path class="l d" pathLength="1" d="M20 140 h360"/>
<!-- арка (Arcus) -->
<path class="l d d2 w" pathLength="1" d="M70 140 v-50 a130 130 0 0 1 260 0 v50" style="stroke-width:2.4"/>
<path class="l d d3 w" pathLength="1" d="M90 140 v-46 a110 110 0 0 1 220 0 v46" style="stroke-width:1.2;opacity:.6"/>
<!-- слънце -->
<g class="sun"><path class="l d d4 g" pathLength="1" d="M200 56 m-10 0 a10 10 0 1 0 20 0 a10 10 0 1 0 -20 0 M200 40 v-5 M200 72 v5 M184 56 h-5 M216 56 h5 M189 45 l-3 -3 M211 45 l3 -3 M189 67 l-3 3 M211 67 l3 3"/></g>
<!-- хора, хванати за ръце -->
<g class="fi fi2">
<g class="p"><path class="l" d="M120 140 c0 -16 8 -24 16 -24 s16 8 16 24 M136 104 a7 7 0 1 1 0.1 0"/></g>
<g class="p p2"><path class="l" d="M152 140 c0 -16 8 -24 16 -24 s16 8 16 24 M168 104 a7 7 0 1 1 0.1 0"/></g>
<g class="p p3"><path class="l w" d="M184 140 c0 -18 8 -28 16 -28 s16 10 16 28 M200 100 a8 8 0 1 1 0.1 0"/></g>
<g class="p p4"><path class="l" d="M216 140 c0 -16 8 -24 16 -24 s16 8 16 24 M232 104 a7 7 0 1 1 0.1 0"/></g>
<g class="p p5"><path class="l" d="M248 140 c0 -16 8 -24 16 -24 s16 8 16 24 M264 104 a7 7 0 1 1 0.1 0"/></g>
</g>

</svg>
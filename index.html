<style>
  :root{
    --bg:#f6efe2; --surface:#fffaf0; --surface2:#f7edda; --card:#fffdf4;
    --gold:#c8643c; --gold-soft:#b07a4a; --gilt:#e9c98a;
    --cream:#3a2c23; --text:#5a4a3c; --mid:#8a6f5c; --muted:#a8927c;
    --dark:#1d1611; --dark2:#2b221a; --ondark:#f3e9d6; --ondark-mid:#cdbfa8;
    --line:rgba(58,44,35,0.16); --line-soft:rgba(58,44,35,0.07);
    --serif:'Cormorant Garamond',Georgia,serif;
    --sans:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    --wrap:1180px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html{scroll-behavior:smooth;}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.5;-webkit-font-smoothing:antialiased;}
  a{color:inherit;}
  img{display:block;max-width:100%;}
  button{font-family:inherit;cursor:pointer;}
  .wrap{max-width:var(--wrap);margin:0 auto;padding:0 28px;}
  @media(max-width:640px){.wrap{padding:0 18px;}}
  h1,h2,h3{font-family:var(--serif);font-weight:500;color:var(--cream);line-height:1.12;}
  .kicker{color:var(--gold);font-size:11px;letter-spacing:3px;text-transform:uppercase;margin-bottom:10px;}
  .lead{color:var(--mid);font-size:17px;line-height:1.65;max-width:720px;white-space:pre-line;}
  .body{color:var(--text);font-size:16px;line-height:1.7;white-space:pre-line;max-width:760px;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--gold);background:var(--gold);color:#fdf3e3;
    padding:12px 22px;border-radius:6px;font-size:12.5px;letter-spacing:2px;text-transform:uppercase;text-decoration:none;transition:background .2s,transform .15s;}
  .btn:hover{background:#b5532f;}
  .btn:active{transform:scale(.98);}
  .btn.ghost{background:transparent;color:var(--gold);}
  .btn.ghost:hover{background:rgba(200,100,60,.08);}
  .btn.dark{background:var(--dark);border-color:var(--dark);color:var(--ondark);}
  .btn.gilt{background:transparent;border-color:var(--gilt);color:var(--gilt);}
  .btn.gilt:hover{background:rgba(233,201,138,.12);}
  .btn.sm{padding:9px 16px;font-size:11.5px;}
  .btn[disabled]{opacity:.5;cursor:not-allowed;}
  .tlink{color:var(--gold);text-decoration:none;font-size:14px;letter-spacing:.5px;}
  .tlink:hover{text-decoration:underline;text-underline-offset:4px;}

  /* ---------- Интро (кратка анимация преди сайта) ---------- */
  .intro{position:fixed;inset:0;z-index:200;background:var(--dark);color:var(--ondark);display:flex;flex-direction:column;overflow:hidden;
    transition:opacity .7s ease;}
  .intro.out{opacity:0;pointer-events:none;}
  .intro .logoarea{flex:1;display:flex;align-items:center;justify-content:center;padding:60px 24px 10px;}
  .intro .biglogo{width:min(44vw,460px);filter:drop-shadow(0 10px 40px rgba(0,0,0,.5));animation:introIn 1.1s cubic-bezier(.2,.7,.2,1) both;}
  @keyframes introIn{from{opacity:0;transform:scale(.85) translateY(10px)}to{opacity:1;transform:none}}
  .intro .skip{position:absolute;top:22px;right:26px;background:none;border:1px solid rgba(243,233,214,.35);color:var(--ondark);border-radius:20px;padding:7px 14px;font-size:12px;letter-spacing:1px;}
  .frieze{position:relative;width:100%;color:var(--gilt);opacity:.95;pointer-events:none;filter:drop-shadow(0 0 2.5px rgba(233,201,138,.35));margin-bottom:max(30px,5vh);}
  .frieze svg{display:block;width:100%;height:auto;overflow:visible;}
  .frieze svg *{stroke:currentColor;fill:none;stroke-width:1.1;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;}
  .frieze svg .d{opacity:.5;}
  .frieze svg .f{fill:currentColor;stroke:none;}
  @keyframes f-toast{0%,100%{transform:rotate(0)}40%,60%{transform:rotate(-22deg) translateY(-2px)}}
  @keyframes f-toast2{0%,100%{transform:rotate(0)}40%,60%{transform:rotate(22deg) translateY(-2px)}}
  @keyframes f-pour{0%,100%{transform:rotate(0)}50%{transform:rotate(-40deg)}}
  @keyframes f-lean{0%,100%{transform:rotate(0)}50%{transform:rotate(9deg)}}
  @keyframes f-lean2{0%,100%{transform:rotate(0)}50%{transform:rotate(-9deg)}}
  @keyframes f-clap{0%,100%{transform:rotate(0)}50%{transform:rotate(-30deg)}}
  @keyframes f-clap2{0%,100%{transform:rotate(0)}50%{transform:rotate(30deg)}}
  @keyframes f-sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
  @keyframes f-strum{0%,100%{transform:rotate(0)}50%{transform:rotate(-30deg)}}
  @keyframes f-spin{0%{transform:rotate(-14deg)}25%{transform:rotate(0) translateY(-4px)}50%{transform:rotate(14deg)}75%{transform:rotate(0) translateY(-4px)}100%{transform:rotate(-14deg)}}
  @keyframes f-up{0%,100%{transform:rotate(0)}50%{transform:rotate(-60deg)}}
  @keyframes f-up2{0%,100%{transform:rotate(0)}50%{transform:rotate(60deg)}}
  @keyframes f-jump{0%,100%{transform:translateY(0)}30%{transform:translateY(-8px)}50%{transform:translateY(0)}}
  @keyframes f-cross{0%{transform:translateX(-60px)}100%{transform:translateX(1460px)}}
  @keyframes f-leg{0%,100%{transform:rotate(22deg)}50%{transform:rotate(-22deg)}}
  @keyframes f-leg2{0%,100%{transform:rotate(-22deg)}50%{transform:rotate(22deg)}}
  @keyframes f-note{0%{transform:translateY(0);opacity:0}20%{opacity:.9}100%{transform:translateY(-40px) translateX(8px);opacity:0}}
  @keyframes f-nod{0%,100%{transform:rotate(0)}50%{transform:rotate(7deg)}}
  @keyframes f-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
  @keyframes f-pan{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  @keyframes f-flame{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.3) translateY(-1px)}}
  @keyframes f-keys{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
  @keyframes f-page2{0%,100%{transform:skewX(0)}50%{transform:skewX(-14deg)}}
  .fa-flame{animation:f-flame .7s ease-in-out infinite}.fa-keys{animation:f-keys .35s ease-in-out infinite}
  .fa-page{animation:f-page2 3.4s ease-in-out infinite}
  .fa-toast{animation:f-toast 2.4s ease-in-out infinite}.fa-toast2{animation:f-toast2 2.4s ease-in-out infinite}
  .fa-pour{animation:f-pour 2.8s ease-in-out infinite}.fa-lean{animation:f-lean 3s ease-in-out infinite}.fa-lean2{animation:f-lean2 3s ease-in-out infinite .4s}
  .fa-clap{animation:f-clap .45s ease-in-out infinite}.fa-clap2{animation:f-clap2 .45s ease-in-out infinite}
  .fa-sway{animation:f-sway 1.6s ease-in-out infinite}.fa-sway2{animation:f-sway 1.2s ease-in-out infinite .3s}.fa-strum{animation:f-strum .45s ease-in-out infinite}
  .fa-spin{animation:f-spin 1.2s ease-in-out infinite}.fa-spin2{animation:f-spin 1.2s ease-in-out infinite .6s}
  .fa-up{animation:f-up 1.4s ease-in-out infinite}.fa-up2{animation:f-up2 1.4s ease-in-out infinite}.fa-jump{animation:f-jump 1.4s ease-in-out infinite .2s}
  .fa-cross{animation:f-cross 22s linear infinite}.fa-leg{animation:f-leg .5s ease-in-out infinite}.fa-leg2{animation:f-leg2 .5s ease-in-out infinite}
  .fa-note{animation:f-note 2.2s ease-out infinite}.fa-note2{animation:f-note 2.2s ease-out infinite 1.1s}
  .fa-nod{animation:f-nod 2.4s ease-in-out infinite}.fa-nod2{animation:f-nod 2.9s ease-in-out infinite .7s}.fa-bob{animation:f-bob 1.3s ease-in-out infinite}
  @media(max-width:760px){.intro .biglogo{width:min(68vw,300px);}.frieze{width:200%;animation:f-pan 40s linear infinite alternate;}}
  @media(prefers-reduced-motion:reduce){.frieze,.frieze *,.intro .biglogo{animation:none!important;}}

  /* ---------- Хедър ---------- */
  .hdr{position:sticky;top:0;z-index:50;background:rgba(29,22,17,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--ondark);border-bottom:1px solid rgba(233,201,138,.14);}
  .hdr .wrap{display:flex;align-items:center;gap:18px;height:68px;}
  .hdr .logo{display:flex;align-items:center;gap:10px;color:var(--gilt);text-decoration:none;flex:none;}
  .hdr .logo .lg{width:52px;display:block;}
  .hdr .logo .nm{font-family:var(--serif);font-size:15px;letter-spacing:1px;line-height:1.1;color:var(--ondark);}
  .nav{display:flex;align-items:center;gap:2px;margin-left:8px;}
  .nav .it{position:relative;}
  .nav .it>a{display:block;padding:10px 12px;color:var(--ondark-mid);text-decoration:none;font-size:12.5px;letter-spacing:1.6px;text-transform:uppercase;border-radius:6px;white-space:nowrap;}
  .nav .it>a:hover,.nav .it.on>a{color:var(--gilt);}
  .nav .it.on>a{text-decoration:underline;text-underline-offset:8px;text-decoration-color:rgba(233,201,138,.6);}
  .nav .sub{position:absolute;top:100%;left:0;min-width:210px;background:var(--dark2);border:1px solid rgba(233,201,138,.18);border-radius:10px;padding:8px;display:none;box-shadow:0 14px 34px rgba(0,0,0,.35);}
  .nav .it:hover .sub,.nav .it:focus-within .sub{display:block;}
  .nav .sub a{display:block;padding:9px 12px;color:var(--ondark);text-decoration:none;font-size:13.5px;border-radius:6px;}
  .nav .sub a:hover{background:rgba(233,201,138,.1);color:var(--gilt);}
  .hdr .right{margin-left:auto;display:flex;align-items:center;gap:10px;}
  .hdr .soc{display:flex;gap:4px;}
  .hdr .soc a{display:flex;align-items:center;justify-content:center;width:34px;height:34px;color:var(--ondark-mid);border-radius:50%;}
  .hdr .soc a:hover{color:var(--gilt);background:rgba(233,201,138,.1);}
  .hdr .soc svg{width:17px;height:17px;fill:currentColor;}
  .hdr .lang{background:none;border:1px solid rgba(233,201,138,.35);color:var(--ondark);border-radius:20px;padding:6px 12px;font-size:11.5px;letter-spacing:1.5px;}
  .hdr .lang:hover{border-color:var(--gilt);color:var(--gilt);}
  .hdr .login{color:var(--gilt);text-decoration:none;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;padding:8px 6px;white-space:nowrap;}
  .hdr .burger{display:none;background:none;border:0;color:var(--ondark);width:40px;height:40px;align-items:center;justify-content:center;}
  .hdr .burger svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;}
  @media(max-width:1080px){
    .nav,.hdr .soc,.hdr .install{display:none;}
    .hdr .burger{display:flex;}
    .hdr .wrap{height:62px;}
  }
  .mnav{position:fixed;inset:0;z-index:60;background:var(--dark);color:var(--ondark);padding:24px 26px 40px;overflow:auto;display:none;flex-direction:column;}
  .mnav.open{display:flex;}
  .mnav .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;}
  .mnav .close{background:none;border:0;color:var(--ondark);font-size:30px;line-height:1;}
  .mnav a{color:var(--ondark);text-decoration:none;}
  .mnav .grp{border-bottom:1px solid rgba(233,201,138,.14);padding:14px 0;}
  .mnav .grp>a{font-family:var(--serif);font-size:24px;display:block;}
  .mnav .grp .sub{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:8px;}
  .mnav .grp .sub a{font-size:14px;color:var(--ondark-mid);}
  .mnav .acts{margin-top:auto;display:flex;flex-direction:column;gap:12px;padding-top:22px;}
  .mnav .soc{display:flex;gap:16px;justify-content:center;}
  .mnav .soc svg{width:22px;height:22px;fill:var(--ondark-mid);}

  /* ---------- Начало: слайдер ---------- */
  .heroslider{position:relative;height:min(88vh,760px);min-height:460px;background:var(--dark);color:var(--ondark);overflow:hidden;}
  .heroslider .slide{position:absolute;inset:0;opacity:0;transition:opacity 1.2s ease;}
  .heroslider .slide.on{opacity:1;}
  .heroslider .slide .pic{position:absolute;inset:0;background-size:cover;background-position:center;transform:scale(1);animation:kb 16s ease-in-out infinite alternate;}
  .heroslider .slide video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  @keyframes kb{from{transform:scale(1)}to{transform:scale(1.07)}}
  .heroslider .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(29,22,17,.25) 0%,rgba(29,22,17,.1) 40%,rgba(29,22,17,.82) 100%);}
  .heroslider .txt{position:absolute;left:0;right:0;bottom:0;padding:0 0 64px;}
  .heroslider .txt .wrap{max-width:var(--wrap);}
  .heroslider .txt h1{color:#f7efe0;font-size:clamp(34px,5.4vw,66px);max-width:760px;margin-bottom:14px;font-weight:400;}
  .heroslider .txt p{color:var(--ondark-mid);font-size:16px;max-width:560px;margin-bottom:24px;line-height:1.6;}
  .heroslider .dots{position:absolute;right:28px;bottom:28px;display:flex;gap:8px;}
  .heroslider .dots button{width:9px;height:9px;border-radius:50%;border:1px solid var(--gilt);background:transparent;padding:0;}
  .heroslider .dots button.on{background:var(--gilt);}
  .heroslider .mark{position:absolute;top:26px;left:28px;width:90px;color:var(--gilt);opacity:.9;}
  @media(max-width:640px){.heroslider{height:78vh;min-height:520px;}.heroslider .txt{padding-bottom:54px;}.heroslider .mark{width:64px;top:18px;left:18px;}.heroslider .dots{left:18px;right:auto;bottom:22px;}}
  @media(prefers-reduced-motion:reduce){.heroslider .slide .pic{animation:none;}}

  /* ---------- Секции ---------- */
  section.sec{padding:72px 0;}
  section.sec.tight{padding:48px 0;}
  section.sec.dark{background:var(--dark);color:var(--ondark);}
  section.sec.dark h2,section.sec.dark h3{color:#f7efe0;}
  section.sec.dark .lead,section.sec.dark .body{color:var(--ondark-mid);}
  section.sec.dark .kicker{color:var(--gilt);}
  section.sec.alt{background:var(--surface2);}
  .sechead{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:28px;flex-wrap:wrap;}
  .sechead h2{font-size:clamp(28px,3.4vw,40px);}
  .manifesto{text-align:center;padding:84px 0;}
  .manifesto p{font-family:var(--serif);font-size:clamp(22px,2.6vw,30px);line-height:1.4;color:var(--cream);max-width:820px;margin:0 auto 26px;white-space:pre-line;}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:44px;align-items:center;}
  .two img,.two .ph{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:18px;}
  .two .ph{background:var(--dark2);display:flex;align-items:center;justify-content:center;color:var(--gilt);}
  .two .ph .lg{width:34%;}
  .two.rev>*:first-child{order:2;}
  @media(max-width:820px){.two{grid-template-columns:1fr;gap:26px;}.two.rev>*:first-child{order:0;}}
  .grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;}
  .grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;}
  .grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;}
  @media(max-width:960px){.grid3,.grid4{grid-template-columns:repeat(2,minmax(0,1fr));}}
  @media(max-width:600px){.grid3,.grid2,.grid4{grid-template-columns:1fr;}}
  .gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:24px;}
  .gal img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:14px;}
  .gal.big img{aspect-ratio:3/2;}

  /* събитие — карта */
  .ev{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line-soft);border-radius:18px;overflow:hidden;text-decoration:none;color:inherit;transition:transform .2s,box-shadow .2s;}
  .ev:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(58,44,35,.12);}
  .ev .pic{aspect-ratio:3/2;background:var(--dark2) center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:var(--gilt);}
  .ev .pic .lg{width:30%;opacity:.9;}
  .ev .bd{padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px;flex:1;}
  .ev .cat{align-self:flex-start;font-size:10px;letter-spacing:1.6px;text-transform:uppercase;color:var(--gold);border:1px solid rgba(200,100,60,.45);border-radius:4px;padding:3px 7px;}
  .ev .when{font-size:13px;color:var(--mid);letter-spacing:.5px;}
  .ev h3{font-size:22px;margin-top:2px;}
  .ev .desc{color:var(--mid);font-size:14px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .ev .ft{margin-top:auto;padding-top:12px;display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .ev .price{font-size:14px;color:var(--cream);}
  section.sec.dark .ev{background:var(--dark2);border-color:rgba(233,201,138,.14);}
  section.sec.dark .ev h3{color:#f7efe0;}
  section.sec.dark .ev .desc,section.sec.dark .ev .when{color:var(--ondark-mid);}
  section.sec.dark .ev .price{color:var(--ondark);}
  section.sec.dark .ev .cat{color:var(--gilt);border-color:rgba(233,201,138,.45);}
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0 30px;}
  .filters button{border:1px solid var(--line);background:transparent;color:var(--text);border-radius:20px;padding:8px 16px;font-size:12.5px;letter-spacing:1.5px;text-transform:uppercase;}
  .filters button.on{background:var(--dark);border-color:var(--dark);color:var(--ondark);}
  .empty{color:var(--muted);padding:30px 0;font-style:italic;}

  /* страница на събитие */
  .evhero{position:relative;background:var(--dark);color:var(--ondark);min-height:52vh;display:flex;align-items:flex-end;overflow:hidden;}
  .evhero .pic{position:absolute;inset:0;background:center/cover no-repeat;opacity:.55;}
  .evhero .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(29,22,17,.2),rgba(29,22,17,.9));}
  .evhero .wrap{position:relative;padding-top:60px;padding-bottom:44px;}
  .evhero h1{color:#f7efe0;font-size:clamp(32px,4.6vw,58px);max-width:820px;}
  .evhero .meta{display:flex;gap:18px;flex-wrap:wrap;color:var(--ondark-mid);font-size:14px;margin-top:14px;letter-spacing:.3px;}

  .pagehead{padding:64px 0 28px;}

  .legal .body{max-width:820px;}

<script src="vendor/supabase.js"></script>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>

<script src="brand.js"></script>

<script>
// ============================================================
//  ПУБЛИЧЕН САЙТ ac2.bg — една страница, хеш адреси (#/program, #/event/…).
//  Съдържанието идва от Supabase (site_content 'public' + 'landing', events с pub.show),
//  а по подразбиране — от PUB_DEFAULTS / SITE_DEFAULTS в db.js.
//  Членското приложение е отделно: /app/ (APP_URL в config.js).
// ============================================================
const CFG=window.ACAC_CONFIG||{};
const SITE_URL=CFG.SITE_URL||'https://ac2.bg/';
const APP_URL=CFG.APP_URL||(SITE_URL+'app/');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let lang=(()=>{try{return localStorage.getItem('lang')||((navigator.language||'').toLowerCase().startsWith('bg')?'bg':'bg');}catch(e){return 'bg';}})();
if(lang!=='bg'&&lang!=='en')lang='bg';
const L=(bg,en)=>lang==='bg'?bg:en;

// ---------- Текстове на интерфейса ----------
const UI={
  home:['Начало','Home'],program:['Програма','Programme'],stage:['Сцена','Stage'],gallery:['Галерия','Gallery'],cinema:['Кино','Cinema'],
  restaurant:['Ресторант','Restaurant'],menu:['Меню','Menu'],dinners:['Тематични вечери','Themed dinners'],brunch:['Брънч','Brunch'],
  membership:['Членство','Membership'],about:['За AC²','About AC²'],team:['Екип','Team'],rent:['Наеми AC² за своето събитие','Hire AC² for your event'],
  college:['Arcus College','Arcus College'],app:['App','App'],contacts:['Контакти','Contacts'],
  login:['Вход за членове','Member login'],install:['Инсталирай приложението','Install the app'],
  all:['Всички','All'],upcoming:['Предстоящо','Upcoming'],whole:['Цялата програма','Full programme'],
  tickets:['Билети','Tickets'],reserve:['Резервация','Reserve'],details:['Подробности','Details'],table:['Резервирай маса','Book a table'],
  free:['Вход свободен','Free entry'],lv:['лв.','BGN'],from:['от','from'],until:['до','until'],
  apply:['Кандидатствай','Apply'],allBenefits:['Всички предимства','All benefits'],readRules:['Правилник на клуба','Club rules'],
  faq:['Често задавани въпроси','Frequently asked questions'],perYear:['/ година','/ year'],
  subscribe:['Запиши се','Subscribe'],email:['Имейл','Email'],name:['Име','Name'],phone:['Телефон','Phone'],subject:['Тема','Subject'],message:['Съобщение','Message'],
  send:['Изпрати','Send'],sending:['Изпращане…','Sending…'],sent:['Благодарим! Ще се свържем с вас.','Thank you! We will be in touch.'],
  nlok:['Записахте се. Очаквайте първия бюлетин.','You are subscribed. Expect the first newsletter soon.'],
  consentNl:['Съгласен съм да получавам бюлетина на AC² и приемам политиката за поверителност.','I agree to receive the AC² newsletter and accept the privacy policy.'],
  consentContact:['Съгласен съм данните ми да бъдат използвани за отговор на запитването.','I agree that my details are used to answer my enquiry.'],
  errCaptcha:['Проверката за робот не мина. Опитайте отново.','The robot check failed. Please try again.'],
  errFields:['Попълнете всички задължителни полета.','Please fill in all required fields.'],
  errEmail:['Невалиден имейл.','Invalid email.'],errPhone:['Невалиден телефон.','Invalid phone number.'],errConsent:['Нужно е съгласие.','Consent is required.'],
  errGeneric:['Нещо се обърка. Опитайте пак след малко.','Something went wrong. Please try again.'],
  address:['Адрес','Address'],hours:['Работно време','Opening hours'],parking:['Паркиране','Parking'],access:['Достъпност','Accessibility'],
  openMaps:['Отвори в Google Maps','Open in Google Maps'],legal:['Правна информация','Legal'],privacy:['Поверителност','Privacy'],cookies:['Бисквитки','Cookies'],
  cookieText:['Използваме бисквитки за статистика и реклама само с вашето съгласие.','We use cookies for statistics and advertising only with your consent.'],
  acceptAll:['Приемам','Accept'],onlyNeeded:['Само необходимите','Only necessary'],more:['Научи повече','Learn more'],
  archive:['Това събитие вече е минало. Страницата остава като архив.','This event has passed. The page remains as an archive.'],
  date:['Дата','Date'],time:['Час','Time'],place:['Място','Venue'],price:['Цена','Price'],participants:['Участници','Participants'],
  concept:['Концепция','Concept'],curator:['Куратор','Curator'],authors:['Представени автори','Featured artists'],visit:['Информация за посещение','Visiting information'],
  works:['Произведения','Works'],chef:['Шеф-готвач','Chef'],skip:['Пропусни','Skip'],addHome:['На Android: отворете сайта в Chrome → меню ⋮ → „Добави на началния екран".','On Android: open the site in Chrome → menu ⋮ → "Add to Home screen".'],
  soon:['очаквайте скоро','coming soon'],seeMenu:['Виж менюто','See the menu'],restaurantPage:['Ресторантът','The restaurant'],
  membershipPage:['Членство','Membership'],collegeSite:['Сайтът на колежа','College website'],why:['Защо да стана член?','Why become a member?'],
  how:['Как се кандидатства','How to apply'],terms:['Пълни условия','Full terms'],levels:['Нива на членство','Membership levels'],
  features:['Какво има вътре','What is inside'],specs:['Техническа информация','Technical information'],rentTerms:['Условия','Terms'],
  noEvents:['Няма предстоящи събития в това направление. Вижте цялата програма.','No upcoming events in this direction. See the full programme.'],
  pastEvents:['Архив','Archive'],inApp:['В приложението','In the app'],season:['Тема на сезона','Season theme']
};
const t=k=>{const v=UI[k];return v?(lang==='bg'?v[0]:v[1]):k;};

// ---------- Съдържание ----------
const PD=window.PUB_DEFAULTS, SD=window.SITE_DEFAULTS;
let PUB=null, LAND=null, EVENTS=null;
const dig=(o,p)=>p.split('.').reduce((a,k)=>(a&&a[k]!==undefined&&a[k]!==null)?a[k]:undefined,o||{});
const loc=v=>{ if(v&&typeof v==='object'&&!Array.isArray(v)&&('bg'in v||'en'in v)){return (lang==='bg'?(v.bg||v.en):(v.en||v.bg))||'';} return v==null?'':v; };
// pT('home.manifesto.body') → текст на текущия език: от базата, иначе по подразбиране
function pT(path){
  const v=dig(PUB,path), d=dig(PD,path);
  if(v&&typeof v==='object'&&!Array.isArray(v)){ const s=lang==='bg'?(v.bg||''):(v.en||''); if(s)return s; const s2=lang==='bg'?(v.en||''):(v.bg||''); return s2||loc(d); }
  if(v!==undefined&&v!==''&&v!==null)return String(v);
  return loc(d);
}
// pV — сурова стойност (bool/число/масив/обект) с fallback
function pV(path){ const v=dig(PUB,path); return (v===undefined||v===null||v==='')?dig(PD,path):v; }
function pA(path){ const v=dig(PUB,path); if(Array.isArray(v))return v; const d=dig(PD,path); return Array.isArray(d)?d:[]; }
// масив, но празен масив в базата НЕ пада на defaults (админът може да изтрие всичко) — освен ако липсва
function pImgs(path){ return pA(path).filter(Boolean); }
function on(path){ const v=dig(PUB,path); return (v===undefined||v===null)?!!dig(PD,path):!!v; }
// членства — от 'landing' (същите текстове, които вижда и приложението)
function lT(path){ const v=dig(LAND,path), d=dig(SD,path); if(v&&typeof v==='object'){const s=lang==='bg'?(v.bg||''):(v.en||''); if(s)return s;} else if(v)return String(v); return loc(d); }

async function loadAll(){
  const [p,l,ev]=await Promise.all([DB.getSiteContent('public'),DB.getSiteContent('landing'),DB.listPublicEvents().catch(()=>[])]);
  PUB=p||{}; LAND=l||{}; EVENTS=ev||[];
}

// ---------- Дати ----------
const MONTHS={bg:['януари','февруари','март','април','май','юни','юли','август','септември','октомври','ноември','декември'],en:['January','February','March','April','May','June','July','August','September','October','November','December']};
const MSHORT={bg:['ян','фев','март','апр','май','юни','юли','авг','септ','окт','ноем','дек'],en:['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']};
const WD={bg:['неделя','понеделник','вторник','сряда','четвъртък','петък','събота'],en:['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday']};
const todayIso=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
function fmtD(iso,long){ if(!iso)return ''; const [y,m,d]=iso.split('-').map(Number); if(!y)return iso; return long?`${d} ${MONTHS[lang][m-1]} ${y}`:`${d} ${MSHORT[lang][m-1]}`; }
function fmtWD(iso){ if(!iso)return ''; const dt=new Date(iso+'T00:00:00'); return WD[lang][dt.getDay()]; }
function fmtTime(s){ return (s||'').slice(0,5); }
function evWhen(e,long){
  if(e.end_date&&e.end_date!==e.date) return `${fmtD(e.date,long)} – ${fmtD(e.end_date,long)}`;
  return fmtD(e.date,long)+(e.time?' · '+fmtTime(e.time):'');
}
function isPast(e){ const td=todayIso(); const last=e.end_date||e.date; return !!last&&last<td; }
function isUpcoming(e){ return !isPast(e)&&!e.archive_only; }
function fmtPrice(e){ if(!(e.price>0))return t('free'); return (Math.round(e.price*100)/100).toLocaleString(lang==='bg'?'bg-BG':'en-GB')+' '+t('lv'); }

// ---------- Категории / направления ----------
const CATS={exhibition:['Изложба','Exhibition'],theatre:['Театър','Theatre'],concert:['Концерт','Concert'],dance:['Танц','Dance'],performance:['Пърформанс','Performance'],discussion:['Дискусия','Discussion'],film:['Кино','Film'],dinner:['Тематична вечеря','Themed dinner'],other:['Събитие','Event']};
const DIRS=['stage','gallery','cinema'];
const FMT_DIR={culture:'stage',cinema:'cinema',table:'dinner',music:'stage',conversation:'stage',community:'stage',theater:'stage',online:'stage'};
const FMT_CAT={cinema:'film',table:'dinner',music:'concert',conversation:'discussion',theater:'theatre'};
const evDir=e=>(e.pub&&e.pub.direction)||FMT_DIR[e.format]||'stage';
const evCat=e=>(e.pub&&e.pub.category)||FMT_CAT[e.format]||(evDir(e)==='gallery'?'exhibition':'other');
const catName=c=>{const v=CATS[c]||CATS.other;return lang==='bg'?v[0]:v[1];};
const evTitle=e=>(lang==='en'&&e.pub&&e.pub.title_en)?e.pub.title_en:e.title;
const evDesc=e=>(lang==='en'&&e.pub&&e.pub.desc_en)?e.pub.desc_en:(e.description||'');
// бутонът за билет/резервация: външна система → линк; иначе → приложението (членове)
function evAction(e){
  const ext=e.pub&&e.pub.ticket_url;
  const dinner=evDir(e)==='dinner';
  const label=dinner?t('table'):(e.price>0?t('tickets'):(e.capacity>0?t('reserve'):t('details')));
  if(ext)return {href:ext,label,ext:true,kind:dinner?'reservation_click':'ticket_click'};
  if(e.price>0||e.capacity>0||dinner)return {href:APP_URL+'#event/'+e.id,label,ext:true,kind:dinner?'reservation_click':'ticket_click'};
  return {href:'#/event/'+e.id,label,ext:false,kind:'details_click'};
}
function evCard(e,dark){
  const a=evAction(e);
  const pic=e.image_url?`<div class="pic" style="background-image:url('${esc(e.image_url)}')"></div>`:`<div class="pic"><span class="lg">${LOGO_SVG}</span></div>`;
  return `<div class="ev">
    <a href="#/event/${esc(e.id)}" style="text-decoration:none;color:inherit;">${pic}</a>
    <div class="bd">
      <span class="cat">${esc(catName(evCat(e)))}</span>
      <div class="when">${esc(evWhen(e))}${e.place?' · '+esc(e.place):''}</div>
      <h3><a href="#/event/${esc(e.id)}" style="text-decoration:none;color:inherit;">${esc(evTitle(e))}</a></h3>
      ${evDesc(e)?`<div class="desc">${esc(evDesc(e))}</div>`:''}
      <div class="ft"><span class="price">${(evDir(e)==='dinner'&&!(e.price>0))?'':esc(fmtPrice(e))}</span>
        <a class="btn sm ${dark?'gilt':'ghost'}" href="${esc(a.href)}" ${a.ext?'target="_blank" rel="noopener"':''} onclick="track('${a.kind}',{event_id:'${esc(e.id)}'})">${esc(a.label)}</a></div>
    </div></div>`;
}
// „текущата изложба остава видима през целия период": изложба = упcoming докато end_date не мине
function upcomingEvents(dir){
  return (EVENTS||[]).filter(e=>isUpcoming(e)&&evDir(e)!=='dinner'&&(!dir||evDir(e)===dir))
    .sort((a,b)=>{ // текущи изложби първи; после по дата
      const ax=evCat(a)==='exhibition'&&a.date<=todayIso(), bx=evCat(b)==='exhibition'&&b.date<=todayIso();
      if(ax!==bx)return ax?-1:1; return (a.date||'')<(b.date||'')?-1:1; });
}
const dinners=()=>(EVENTS||[]).filter(e=>isUpcoming(e)&&evDir(e)==='dinner').sort((a,b)=>(a.date||'')<(b.date||'')?-1:1);
const pastEvents=()=>(EVENTS||[]).filter(e=>isPast(e)).sort((a,b)=>(a.date||'')<(b.date||'')?1:-1);

<script>

  return `<div class="heroslider" id="slider">${slidesHtml}

function goSlide(i){
  const s=document.getElementById('slider'); if(!s)return; slideIdx=i;

// ---------- СЪБИТИЕ ----------
function pageEvent(id){

  const dirLabel=evDir(e)==='dinner'?t('restaurant'):t(evDir(e));
  return `<div class="evhero">${e.image_url?`<div class="pic" style="background-image:url('${esc(e.image_url)}')"></div>`:''}<div class="shade"></div>

        ${kv(t('participants'),loc(p.participants))}
        ${kv(t('curator'),loc(p.curator))}
        ${kv(t('authors'),loc(p.authors))}
        ${kv(t('visit'),loc(p.visit))}
        ${g.length?`<div class="kv"><div class="k">${ex?t('works'):L('Галерия','Gallery')}</div>${galleryHtml(g)}</div>`:''}

        <div class="row"><span>${t('date')}</span><span>${esc(evWhen(e,true))}</span></div>
        ${e.time&&!ex?`<div class="row"><span>${t('time')}</span><span>${esc(fmtTime(e.time))}${e.ends?' – '+esc(fmtTime(e.ends)):''}</span></div>`:''}
        ${e.place?`<div class="row"><span>${t('place')}</span><span>${esc(e.place)}</span></div>`:''}
        <div class="row"><span>${t('price')}</span><span>${esc(fmtPrice(e))}</span></div>
        ${!past&&a.href!=='#/event/'+e.id?`<a class="btn" href="${esc(a.href)}" target="_blank" rel="noopener" onclick="track('${a.kind}',{event_id:'${esc(e.id)}'})">${esc(a.label)}</a>${!p.ticket_url?`<div class="hint" style="text-align:center;">${t('inApp')} · ${t('login')}</div>`:''}`:''}

      </div></aside>
    </div></div>`;
}

  if(!body)body=L('Текстът се публикува скоро.','The text will be published soon.');

    ${kind==='cookies'?`<div style="margin-top:24px;"><button class="btn ghost" onclick="resetConsent()">${L('Промени избора за бисквитки','Change cookie choice')}</button></div>`:''}</div>`;

<script>
// ============================================================
//  РУТЕР / РЕНДЕР
// ============================================================
function parseRoute(){
  let h=(location.hash||'').replace(/^#\/?/,'').replace(/\/+$/,'');
  const parts=h.split('/').map(decodeURIComponent);
  return {p0:parts[0]||'',p1:parts[1]||'',p2:parts[2]||''};
}
function pageFor(r){
  switch(r.p0){
    case '': return {html:pageHome(),nav:'',title:''};
    case 'program': return {html:pageProgram(DIRS.includes(r.p1)?r.p1:''),nav:'program',title:t('program')};
    case 'event': return {html:pageEvent(r.p1),nav:'program',title:(()=>{const e=(EVENTS||[]).find(x=>x.id===r.p1);return e?evTitle(e):t('program');})()};
    case 'restaurant':
      if(r.p1==='menu')return {html:pageMenu(),nav:'restaurant',title:t('menu')};
      if(r.p1==='dinners')return {html:pageDinners(),nav:'restaurant',title:t('dinners')};
      if(r.p1==='brunch')return {html:pageBrunch(),nav:'restaurant',title:t('brunch')};
      return {html:pageRestaurant(),nav:'restaurant',title:t('restaurant')};
    case 'membership': return {html:pageMembership(),nav:'membership',title:t('membership')};
    case 'about':
      if(r.p1==='team')return {html:pageTeam(),nav:'about',title:t('team')};
      if(r.p1==='rent')return {html:pageRent(),nav:'about',title:t('rent')};
      return {html:pageAbout(),nav:'about',title:t('about')};
    case 'college': return {html:pageCollege(),nav:'college',title:t('college')};
    case 'app': return {html:pageApp(),nav:'app',title:t('app')};
    case 'contacts': return {html:pageContacts(),nav:'contacts',title:t('contacts')};
    case 'legal': return {html:pageLegal(r.p1),nav:'',title:t('legal')};
    default: return {html:pageHome(),nav:'',title:''};
  }
}
let lastHash=null;
function render(){
  if(PUB===null)return;   // още не е заредено
  const r=parseRoute(); const pg=pageFor(r);
  stopSlider();
  document.getElementById('hdr').innerHTML=header(pg.nav);
  document.getElementById('mnav').innerHTML=mobileNav();
  document.getElementById('page').innerHTML=pg.html;
  document.getElementById('foot').innerHTML=footer();
  document.title=(pg.title?pg.title+' — ':'')+'AC² · American College Arcus Club';
  if(r.p0==='')startSlider();
  mountCaptchas();
  if(location.hash!==lastHash){window.scrollTo({top:0,behavior:'instant'});lastHash=location.hash;}
  track('page_view',{page:'/'+[r.p0,r.p1].filter(Boolean).join('/')});
}
window.addEventListener('hashchange',()=>{closeMenu();render();});

// ---------- Интро: кратка анимация с логото преди сайта (веднъж на посещение) ----------
function showIntro(){
  let seen=false; try{seen=sessionStorage.getItem('ac2_intro')==='1';}catch(e){}
  const reduce=(()=>{try{return matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){return false;}})();
  const el=document.getElementById('intro');
  if(seen||reduce||!on('general.show_intro')||location.hash.length>2){el.remove();return;}
  el.className='intro';
  el.innerHTML=`<button class="skip" onclick="endIntro()">${t('skip')}</button><div class="logoarea"><div class="biglogo">${LOGO_SWEEP_SVG}</div></div><div class="frieze">${FRIEZE_SVG}</div>`;
  try{sessionStorage.setItem('ac2_intro','1');}catch(e){}
  setTimeout(endIntro,3200);
}
function endIntro(){const el=document.getElementById('intro');if(!el)return;el.classList.add('out');setTimeout(()=>el.remove(),750);}

// ---------- Captcha (Cloudflare Turnstile) — по един widget на форма ----------
const _ts={};
function mountCaptchas(tries){
  tries=tries||0;
  const holders=[...document.querySelectorAll('.cap')]; if(!holders.length)return;
  if(!CFG.TURNSTILE_SITE_KEY)return;
  if(!window.turnstile){ if(tries<40)setTimeout(()=>mountCaptchas(tries+1),150); return; }
  holders.forEach(h=>{
    if(h.dataset.rendered==='1'&&h.querySelector('iframe'))return;
    try{ if(_ts[h.id]!==undefined)turnstile.remove(_ts[h.id]); }catch(e){}
    h.innerHTML='';
    _ts[h.id]=turnstile.render(h,{sitekey:CFG.TURNSTILE_SITE_KEY,theme:'light',retry:'auto','refresh-expired':'auto',
      'error-callback':()=>{try{turnstile.reset(_ts[h.id]);}catch(e){}return true;}});
    h.dataset.rendered='1';
  });
}
function captchaToken(id){
  try{ if(_ts[id]!==undefined&&window.turnstile){const v=turnstile.getResponse(_ts[id]); if(v)return v;} }catch(e){}
  try{ const i=document.querySelector('#'+id+' input[name="cf-turnstile-response"]'); if(i&&i.value)return i.value; }catch(e){}
  return '';
}
function resetCaptcha(id){ try{ if(_ts[id]!==undefined)turnstile.reset(_ts[id]); }catch(e){} }
const validPhone=v=>{const s=(v||'').trim(); if(!s)return true; if(!/^\+?[0-9 ()\-.]+$/.test(s))return false; const d=s.replace(/\D/g,''); return d.length>=7&&d.length<=15;};
const validEmail=v=>/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test((v||'').trim());

// ---------- Форми ----------
function setMsg(id,txt,ok){const m=document.getElementById(id);if(!m)return;m.textContent=txt||'';m.className='msg '+(txt?(ok?'ok':'err'):'');}
async function submitContact(f){
  const name=f.name.value.trim(), email=f.email.value.trim(), phone=f.phone.value.trim(), subject=f.subject.value.trim(), message=f.message.value.trim();
  if(!name||!email||!message){setMsg('ct_msg',t('errFields'));return false;}
  if(!validEmail(email)){setMsg('ct_msg',t('errEmail'));return false;}
  if(!validPhone(phone)){setMsg('ct_msg',t('errPhone'));return false;}
  if(!f.consent.checked){setMsg('ct_msg',t('errConsent'));return false;}
  const tok=captchaToken('ct_captcha'); if(CFG.TURNSTILE_SITE_KEY&&!tok){setMsg('ct_msg',t('errCaptcha'));return false;}
  const b=f.querySelector('button[type=submit]'); b.disabled=true; const old=b.textContent; b.textContent=t('sending'); setMsg('ct_msg','');
  const r=await DB.publicForm('contact',{name,email,phone,subject,message,lang,page:location.hash,captcha_token:tok});
  b.disabled=false; b.textContent=old;
  if(r.error){ resetCaptcha('ct_captcha'); setMsg('ct_msg',r.error.captcha?t('errCaptcha'):(r.error.cooldown?L('Твърде много съобщения. Опитайте по-късно.','Too many messages. Try again later.'):(r.error.message||t('errGeneric')))); return false; }
  f.reset(); resetCaptcha('ct_captcha'); setMsg('ct_msg',t('sent'),true); track('contact_submit',{}); return false;
}
async function submitNewsletter(f){
  const email=f.email.value.trim();
  if(!validEmail(email)){setMsg('nl_msg',t('errEmail'));return false;}
  if(!f.consent.checked){setMsg('nl_msg',t('errConsent'));return false;}
  const tok=captchaToken('nl_captcha'); if(CFG.TURNSTILE_SITE_KEY&&!tok){setMsg('nl_msg',t('errCaptcha'));return false;}
  const b=f.querySelector('button[type=submit]'); b.disabled=true; const old=b.textContent; b.textContent=t('sending'); setMsg('nl_msg','');
  const r=await DB.publicForm('newsletter',{email,lang,consent:true,source:'site',captcha_token:tok});
  b.disabled=false; b.textContent=old;
  if(r.error){ resetCaptcha('nl_captcha'); setMsg('nl_msg',r.error.captcha?t('errCaptcha'):(r.error.message||t('errGeneric'))); return false; }
  f.reset(); resetCaptcha('nl_captcha'); setMsg('nl_msg',t('nlok'),true); track('newsletter_signup',{}); return false;
}

// ---------- Бисквитки + аналитика (GA4 / Meta Pixel) — само след съгласие ----------
let consent=null; try{consent=localStorage.getItem('ac2_consent');}catch(e){}
let analyticsLoaded=false;
function cookieBanner(){
  const el=document.getElementById('cookie');
  if(consent||(!CFG.GA_ID&&!CFG.META_PIXEL_ID)){el.classList.remove('show');return;}
  el.innerHTML=`<p>${t('cookieText')} <a href="#/legal/cookies">${t('more')}</a></p><div class="acts"><button class="btn gilt sm" onclick="setConsent('necessary')">${t('onlyNeeded')}</button><button class="btn sm" onclick="setConsent('all')">${t('acceptAll')}</button></div>`;
  el.classList.add('show');
}
function setConsent(v){consent=v;try{localStorage.setItem('ac2_consent',v);}catch(e){}cookieBanner();if(v==='all')loadAnalytics();}
function resetConsent(){consent=null;try{localStorage.removeItem('ac2_consent');}catch(e){}cookieBanner();}
function loadAnalytics(){
  if(analyticsLoaded||consent!=='all')return; analyticsLoaded=true;
  if(CFG.GA_ID){
    const s=document.createElement('script');s.async=true;s.src='https://www.googletagmanager.com/gtag/js?id='+encodeURIComponent(CFG.GA_ID);document.head.appendChild(s);
    window.dataLayer=window.dataLayer||[];window.gtag=function(){dataLayer.push(arguments);};gtag('js',new Date());gtag('config',CFG.GA_ID,{anonymize_ip:true,send_page_view:false});
  }
  if(CFG.META_PIXEL_ID){
    !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
    fbq('init',CFG.META_PIXEL_ID);
  }
  track('page_view',{page:location.hash.replace(/^#/,'')||'/'});
}
// събития за статистиката: page_view, ticket_click, reservation_click, newsletter_signup, contact_submit, app_store_click, apply_click
function track(name,params){
  if(consent!=='all'||!analyticsLoaded)return;
  try{ if(window.gtag){ if(name==='page_view')gtag('event','page_view',{page_path:params.page,page_title:document.title}); else gtag('event',name,params||{}); } }catch(e){}
  try{ if(window.fbq){ if(name==='page_view')fbq('track','PageView'); else fbq('trackCustom',name,params||{}); } }catch(e){}
}
function toast(m){const el=document.getElementById('toast');el.textContent=m;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2600);}

// ---------- Старт ----------
(async function init(){
  document.documentElement.lang=lang;
  PUB={};LAND={};EVENTS=[];      // празни, докато се зареди — интрото покрива паузата
  showIntro();
  cookieBanner(); if(consent==='all')loadAnalytics();
  try{ await loadAll(); }catch(e){}
  render();
  // при връщане в таба — освежаваме програмата (нови събития се появяват без презареждане)
  document.addEventListener('visibilitychange',async()=>{ if(document.visibilityState==='visible'){ try{ EVENTS=await DB.listPublicEvents(); }catch(e){} if(parseRoute().p0===''||parseRoute().p0==='program')render(); } });
})();
</script>
